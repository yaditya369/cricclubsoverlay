
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cricket Score Overlay</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:transparent;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}
html{height:100%}
body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
}

.top {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  min-width: 0;
}

.team {
  display: grid;
  min-width: 0;
  align-items: stretch;
  overflow: hidden;
}

.team.left {
  grid-template-columns:
    clamp(65px, 8vw, 112px)
    minmax(0, 1fr)
    clamp(90px, 11vw, 150px);
}

.team.right {
  grid-template-columns:
    clamp(90px, 11vw, 150px)
    minmax(0, 1fr)
    clamp(65px, 8vw, 112px);
}

.identity {
  min-width: 0;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 6px 5px;
  overflow: hidden;
}

.logo {
  display: block;
  width: min(58px, 100%);
  height: 48px;
  object-fit: contain;
  flex: 0 0 auto;
}

.team-name {
  width: 100%;
  min-width: 0;
  margin: 0;
  font-size: clamp(10px, 1.3vw, 20px);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .4px;
  line-height: 1.15;
  text-align: center;
  overflow-wrap: anywhere;
}
.scorebox {
  min-width: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 8px clamp(5px, 1vw, 10px);
  border-left: 1px solid #62758a;
  border-right: 1px solid #62758a;
}
.right .scorebox{grid-column:1;grid-row:1;border-left:0;border-right:1px solid #62758a}

.score {
  min-width: 0;
  font-size: clamp(20px, 3vw, 43px);
  line-height: 1.05;
  font-weight: 800;
  letter-spacing: -1px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.meta {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-top: 7px;
  font-size: clamp(9px, 1.1vw, 16px);
  line-height: 1.2;
  color: #d1dbe8;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.balls {
  display: flex;
  flex-direction: row;
  align-items: center;
  flex-wrap: nowrap;
  gap: 5px;
  min-width: 0;
  max-width: 100%;
  margin-top: 10px;
  overflow: hidden;
}

.ball-label {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  height: 26px;
  margin: 0 3px 0 0;
  font-size: 10px;
  line-height: 1;
  color: #9eb1c7;
  white-space: nowrap;
}

.ball {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 26px;
  min-width: 26px;
  padding: 0 5px;
  line-height: 1;
  border-radius: 5px;
  font-size: 11px;
}
.details {
  min-width: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 10px clamp(5px, 1vw, 12px);
}
.left .details{grid-column:2;grid-row:1}
.right .details{grid-column:2;grid-row:1}
.player {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 6px;
  min-width: 0;
  margin: 7px 0;
  font-size: clamp(9px, 1vw, 14px);
}

.player-name {
  display: block;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.player-stats {
  min-width: 0;
  white-space: nowrap;
  font-weight: 700;
}
.section-label{font-size:10px;color:#9eb1c7;letter-spacing:.7px;text-transform:uppercase;margin-bottom:5px}
.bowler-name,
.bowler-meta {
  min-width: 0;
  overflow-wrap: anywhere;
}


.ball.wicket{background:#c63c4b;color:#fff}
.ball.boundary{background:#e6bb5d;color:#17263a}
.right .identity{grid-column:3;grid-row:1}
.right .scorebox{grid-column:1;grid-row:1}
.right .details{grid-column:2;grid-row:1}
.bottom{display:none;min-height:53px;align-items:center;justify-content:center;text-align:center;padding:10px 12px;background:#0b1421;border-top:1px solid #33465c;color:#ffd16e;font-weight:800;font-size:20px}
.bottom.visible{display:flex}
.powered{font-size:9px;letter-spacing:1px;font-weight:500;color:#9aabbe;margin-left:14px;white-space:nowrap}
.error{display:none;padding:5px 10px;background:#672a36;font-size:11px}
@media(max-width:900px){
 .top{min-height:115px}
 .team.left{grid-template-columns:72px minmax(0,1fr) 105px}
 .team.right{grid-template-columns:105px minmax(0,1fr) 75px}
 .identity{padding:10px 3px 6px}
 .logo{width:43px;height:37px}
 .team-name{font-size:14px}
 .score{font-size:31px}
 .meta{font-size:12px;margin-top:5px}
 .details{padding:8px}
 .player{font-size:11px;margin:5px 0}
 .bowler-name{font-size:12px}
 .bowler-meta{font-size:11px;margin-top:5px}
 .balls{gap:4px;margin-top:8px}
 .ball{height:25px;min-width:25px;font-size:11px;padding:0 4px}
 .bottom{font-size:15px}
}

@media (max-width: 520px) {
  .meta {
    gap: 4px;
    font-size: 9px;
    margin-top: 5px;
  }

  .balls {
    flex-wrap: nowrap;
    gap: 3px;
    margin-top: 6px;
  }

  .ball-label {
    height: 19px;
    font-size: 8px;
    margin-right: 1px;
  }

  .ball {
    height: 19px;
    min-width: 17px;
    padding: 0 3px;
    font-size: 8px;
  }
}


/* Compact, translucent charcoal scoreboard */
.overlay {
  width:100%;
  margin-top:auto;
  background: rgba(24, 27, 31, var(--overlay-opacity, 0.70));
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 4px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
}

/* Reduce overall row height */
.top {
  min-height: 0;
}

.team.left,
.team.right {
  min-height: 0;
}

/* Smaller logos and tighter team identity */
.identity {
  gap: 2px;
  padding: 3px 5px;
}

.logo {
  width: 30px;
  height: 26px;
  object-fit: contain;
}

.team-name {
  color: #fff;
  font-size: 12px;
  line-height: 1.05;
}

/* Reduce space around player and bowler details */
.details {
  padding: 3px 6px;
}

.player {
  margin: 2px 0;
  line-height: 1.05;
}

.player-name,
.player-stats,
.bowler-name {
  color: #fff;
  line-height: 1.1;
}

.bowler-meta,
.meta {
  color: rgba(255, 255, 255, 0.78);
  margin-top: 2px;
  line-height: 1.05;
}

/* Smaller score panel */
.scorebox {
  padding: 3px 8px;
  background: rgba(255, 255, 255, 0.07);
  border-color: rgba(255, 255, 255, 0.15);
}

.score {
  color: #fff;
  font-size: clamp(20px, 2.3vw, 30px);
  line-height: 1;
}

.balls {
  margin-top: 4px;
  gap: 3px;
}

.ball,
.ball-label {
  height: 19px;
}

.ball {
  min-width: 19px;
  padding: 0 4px;
}

/* Compact bottom row for chase/result */
.bottom {
  min-height: 0;
  padding: 4px 8px;
  background: rgba(15, 17, 20, 0.78);
  border-top: 1px solid rgba(255, 255, 255, 0.15);
  color: #fff;
  font-size: 13px;
}

.powered {
  color: rgba(255, 255, 255, 0.65);
}

/* Smaller screens */
@media (max-width: 520px) {
  .identity {
    padding: 3px;
    gap: 1px;
  }

  .logo {
    width: 23px;
    height: 21px;
  }

  .team-name {
    font-size: 9px;
  }

  .details {
    padding: 3px;
  }

  .scorebox {
    padding: 3px 5px;
  }

  .score {
    font-size: 19px;
  }

  .player {
    margin: 1px 0;
  }

  .ball,
  .ball-label {
    height: 16px;
  }

  .ball {
    min-width: 16px;
    padding: 0 3px;
    font-size: 9px;
  }

  .bottom {
    padding: 3px 5px;
    font-size: 11px;
  }
}

/* Put Overs and Run Rate on separate lines */

.meta {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  line-height: 1.1;
  margin-top: 3px;
}



/* Layout 2: reference broadcast scoreboard. Layout 1 above remains unchanged. */
.overlay.layout2 {
  width: 100%;
  margin-top: auto;
  overflow: hidden;
  border-radius: 9px;
  border: 1px solid rgba(255,255,255,.18);
  background: rgba(24,27,31,var(--overlay-opacity,.70));
  color: #fff;
}
.layout2 .top {
  display: grid;
  grid-template-columns: clamp(78px,8vw,120px) minmax(130px,1fr) clamp(150px,20vw,270px) minmax(130px,1fr) clamp(78px,8vw,120px);
  height: auto;
  min-height: 115px;
  align-items: stretch;
}
.layout2 .team { display: contents; }
.layout2 .team .identity,
.layout2 .team .details,
.layout2 .team .scorebox { min-width: 0; }
.layout2 #logo1 { grid-column: 1; grid-row: 1; }
.layout2 #name1 { grid-column: 1; grid-row: 1; }
.layout2 .team.left .identity { grid-column: 1; grid-row: 1; border: 0; }
.layout2 #details1 { grid-column: 2; grid-row: 1; border: 0; padding: 7px 16px; }
.layout2 .team.left .scorebox { grid-column: 3; grid-row: 1; z-index: 1; }
.layout2 #details2 { grid-column: 4; grid-row: 1; border: 0; padding: 7px 16px; }
.layout2 .team.right .identity { grid-column: 5; grid-row: 1; border: 0; }
.layout2 .team.right .scorebox { display: none !important; }
.layout2 .team.left .scorebox {
  box-sizing: border-box;
  align-self: center;
  justify-self: center;
  width: calc(100% - 12px);
  height: 82px;
  background: rgba(8,20,37,.42);
  border: 1px solid rgba(255,255,255,.20);
  border-radius: 6px;
  padding: 8px 10px;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.layout2 .score { font-size: clamp(26px,3vw,42px); }
.layout2 .meta {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 12px;
  white-space: nowrap;
  font-size: clamp(11px,1.15vw,17px);
  margin-top: 8px;
}
.layout2 .meta span + span::before {
  content: "·";
  display: inline-block;
  margin: 0 10px;
  color: rgba(255,255,255,.78);
}
.layout2 .meta { column-gap: 0; }
.layout2 .identity { gap: 7px; padding: 6px 5px; }
.layout2 .logo { width: min(58px,100%); height: 48px; }
.layout2 .team-name { font-size: clamp(10px,1.1vw,17px); }
.layout2 .player { font-size: clamp(14px,1.45vw,21px); margin: 0; padding: 13px 0; gap: 8px; }
.layout2 .player-name,
.layout2 .bowler-name { font-size: 16px; }
/* Reference screenshot has a thin divider between the two batter rows. */
.layout2 #details1 .player:first-child { border-bottom: 1px solid rgba(190,218,250,.42); }
.layout2 #details1 .player + .player { padding-top: 13px; }
.layout2 .section-label { font-size: clamp(9px,.85vw,12px); }
.layout2 .bowler-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid rgba(190,218,250,.42); }\n.layout2 .bowler-name { font-size: 16px; white-space: nowrap; }
.layout2 .bowler-meta { font-size: 14px; font-weight: 700; margin-top: 0; white-space: nowrap; }
.layout2 .balls {
  margin-top: 10px;
  gap: 5px;
  flex-wrap: wrap;
  overflow: visible;
  max-width: 100%;
}
.layout2 .ball-label {
  font-size: clamp(10px,1vw,14px);
  font-weight: 700;
  margin-right: 3px;
  white-space: nowrap;
}
.layout2 .ball {
  min-width: 27px;
  height: 32px;
  padding: 0 5px;
  flex: 0 1 auto;
  box-sizing: border-box;
  border: 1px solid rgba(190,218,250,.65);
  background: rgba(255,255,255,.05);
  border-radius: 3px;
  font-size: 14px;
}
.layout2 .ball.wicket { background: #d92f45; border-color: #ff8794; color: #fff; font-weight: 800; }
.layout2 .ball.boundary { background: #e6bb5d; border-color: #ffdc85; color: #17263a; font-weight: 800; }
.layout2 .ball.six { background: #36a269; border-color: #79e0a8; color: #fff; font-weight: 800; }
.layout2 .bottom {
  display: none;
  min-height: 0;
  padding: 7px 16px;
  border: 0;
  border-top: 1px solid rgba(255,255,255,.35);
  border-radius: 0 0 8px 8px;
  font-size: clamp(13px,1.25vw,19px);
  font-weight: 700;
  text-align: center;
  justify-content: center;
  background: rgba(10,18,30,.80);
  color: #fff;
}
.layout2 .bottom.visible { display: flex; }
.layout2 #score2, .layout2 #meta2, .layout2 #overs2, .layout2 #rr2 { display: none !important; }
.layout2.theme-blue { background: rgba(20,57,105,var(--overlay-opacity,.70)); }
.layout2.theme-blue .team.left .scorebox { background: rgba(35,79,128,.88); }
.layout2.theme-blue .bottom { background: rgba(12,39,77,.94); }
.layout2.theme-blue .team.left .identity,
.layout2.theme-blue #details1,
.layout2.theme-blue #details2,
.layout2.theme-blue .team.right .identity { border-color: rgba(190,218,250,.48); }
.layout2.theme-blue .team.left .scorebox { border-color: rgba(190,218,250,.35); }
.layout2.theme-blue .meta,
.layout2.theme-blue .bowler-meta { color: #d5e6ff; }
@media (max-width: 650px) {
  .layout2 .top {
    grid-template-columns: 48px minmax(80px,1fr) 100px minmax(80px,1fr) 48px;
    height: auto;
    min-height: 90px;
  }
  .layout2 .team.left .identity,
  .layout2 .team.right .identity { padding: 5px 2px; }
  .layout2 .logo { width: 27px; height: 25px; }
  .layout2 .team-name { font-size: 8px; }
  .layout2 #details1, .layout2 #details2 { padding: 5px 6px; }
  .layout2 .team.left .scorebox { width: calc(100% - 6px); height: 60px; padding: 4px; }
  .layout2 .score { font-size: 22px; }
  .layout2 .meta { font-size: 9px; }
  .layout2 .player { font-size: 10px; margin: 0; padding: 7px 0; gap: 3px; }
  .layout2 .balls { gap: 3px; margin-top: 6px; }
  .layout2 .ball { min-width: 17px; height: 18px; padding: 0 3px; font-size: 9px; }
  .layout2 .ball-label { font-size: 8px; margin-right: 1px; }
}

</style>
</head>
<body>
<div class="overlay">
  <div class="top">
    <section class="team left">
      <div class="identity">
        <img class="logo" id="logo1" alt="">
        <div class="team-name" id="name1">TEAM 1</div>
      </div>
      <div class="details" id="details1"></div>
      <div class="scorebox">
        <div class="score" id="score1">--/--</div>
        <div class="meta" id="meta1">
  <span id="overs1">Overs --</span>
  <span id="rr1">RR --</span>
</div>
      </div>
    </section>

    <section class="team right">
      <div class="scorebox">
        <div class="score" id="score2">--/--</div>
        <div class="meta" id="meta2">
  <span id="overs2">Overs --</span>
  <span id="rr2">RR --</span>
</div>
      </div>
      <div class="details" id="details2"></div>
      <div class="identity">
        <img class="logo" id="logo2" alt="">
        <div class="team-name" id="name2">TEAM 2</div>
      </div>
    </section>
  </div>

  <div class="bottom" id="bottom">
    <span id="bottomText"></span>
  </div>
  <div class="error" id="error"></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const clubId = params.get("clubId") || "22594";
const matchId = params.get("matchId") || "1374";

const requested = Number(params.get("refreshInterval") || params.get("refresh") || 5000);

const opacityValue = Number(params.get("opacity"));

const overlayOpacity = params.has("opacity") && Number.isFinite(opacityValue)
  ? Math.max(0.1, Math.min(1, opacityValue))
  : 0.70;

document.documentElement.style.setProperty(
  "--overlay-opacity",
  overlayOpacity
);

// Layout and theme are independent query parameters.
// layout=1 preserves the original design; layout=2 uses the reference broadcast layout.
const requestedLayout = (params.get("layout") || "1").trim().toLowerCase();
const overlayLayout = requestedLayout === "2" ? "2" : "1";
const requestedTheme = (params.get("theme") || "graphite").trim().toLowerCase();
const overlayTheme = requestedTheme === "blue" ? "blue" : "graphite";
document.querySelector(".overlay").classList.toggle("layout2", overlayLayout === "2");
document.querySelector(".overlay").classList.toggle("theme-blue", overlayTheme === "blue");

const REFRESH_MS = Number.isFinite(requested)
  ? Math.max(1000, Math.min(requested, 60000))
  : 5000;

const API = `https://cricclubs.com/liveScoreOverlayData.do?clubId=${encodeURIComponent(clubId)}&matchId=${encodeURIComponent(matchId)}`;

let stopped = false;
let timer;

const $ = id => document.getElementById(id);
const get = (o,k,d="") => o?.[k] == null || o[k] === "" ? d : String(o[k]);
const truthy = x => ["true","1","yes"].includes(String(x).toLowerCase());

function logo(id,path){
  const img = $(id);
  if(!path){img.style.visibility="hidden";return;}
  img.style.visibility="visible";
  img.src = path.startsWith("http") ? path : new URL(path,"https://cricclubs.com").href;
  img.onerror = () => {img.style.visibility="hidden";};
}

function teamScore(v,p){
  return {
    name:get(v,p+"Name","Team"),
    total:get(v,p+"Total","0"),
    wickets:get(v,p+"Wickets","0"),
    overs:get(v,p+"Overs","0.0"),
    rr:get(v,p+"RR","--")
  };
}

function showScore(n, t) {
  $("name" + n).textContent = t.name;

  const isZeroZero =
    Number(t.total) === 0 && Number(t.wickets) === 0;

  $("score" + n).style.visibility =
    isZeroZero ? "hidden" : "visible";

  $("overs" + n).style.visibility =
    isZeroZero ? "hidden" : "visible";

  $("rr" + n).style.visibility =
    isZeroZero ? "hidden" : "visible";

  if (!isZeroZero) {
    $("score" + n).textContent = `${t.total}/${t.wickets}`;
    const shownOvers = document.querySelector(".overlay").classList.contains("layout2")
      ? formatOvers(t.overs)
      : t.overs;
    $("overs" + n).textContent = `Overs ${shownOvers}`;
    $("rr" + n).textContent = `RR ${t.rr}`;
  }
}
/*
function showScore(n,t){
  $("name"+n).textContent=t.name;
  $("score"+n).textContent=`${t.total}/${t.wickets}`;
  $("overs"+n).textContent=`Overs ${t.overs}`;
  $("rr"+n).textContent=`RR ${t.rr}`;
}
*/
function showBatters(v){
  return `
    <div class="player">
      <span class="player-name">${escapeHTML(get(v,"batsman1Name","Striker"))}</span>
      <span class="player-stats">${escapeHTML(get(v,"batsman1Runs","0"))} (${escapeHTML(get(v,"batsman1Balls","0"))})</span>
    </div>
    <div class="player">
      <span class="player-name">${escapeHTML(get(v,"batsman2Name","Non-striker"))}</span>
      <span class="player-stats">${escapeHTML(get(v,"batsman2Runs","0"))} (${escapeHTML(get(v,"batsman2Balls","0"))})</span>
    </div>`;
}

function showBowler(v,balls){
  const recent = Array.isArray(balls) ? balls.slice(-7) : [];
  const chips = recent.map(b=>{
    const x=String(b);
    let cls="ball";
    if(x.toUpperCase().includes("W")) cls+=" wicket";
    else if(x==="6") cls+=" boundary six";
    else if(x==="4") cls+=" boundary";
    return `<span class="${cls}">${escapeHTML(x)}</span>`;
  }).join("");

  return `
    <div class="bowler-row">
      <div class="bowler-name">${escapeHTML(get(v,"bowlerName","--"))}</div>
      <div class="bowler-meta">${escapeHTML(get(v,"bowlerWickets","0"))}/${escapeHTML(get(v,"bowlerRuns","0"))} (${escapeHTML(formatOvers(get(v,"bowlerOvers","0.0")))})</div>
    </div>
    <div class="balls"><span class="ball-label">THIS OVER</span>${chips}</div>`;
}

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function formatOvers(overs) {
  const value = String(overs ?? "").trim();
  if (!value) return "0.0";

  // CricClubs may return completed overs as "15", "15.", or "15.0".
  // Normalize all completed-over representations to include the .0 suffix.
  const completedOvers = value.match(/^(\\d+)\\.?$/);
  if (completedOvers) return `${completedOvers[1]}.0`;

  return value;
}

function overBalls(overs){
  const p=String(overs||"").split(".");
  const o=Number(p[0]), b=p.length>1?Number(p[1]):0;
  return Number.isFinite(o)&&Number.isFinite(b)?o*6+b:null;
}

function completed(data,v){
  return [
    data.isMatchEnded,data.matchEnded,data.isCompleted,
    v.isMatchEnded,v.matchEnded,v.isCompleted
  ].some(truthy);
}

function render(data){
  const v=data.values||{};
  const second=truthy(data.isSecondInningsStarted)||truthy(v.isSecondInningsStarted);
  const t1=teamScore(v,"t1");
  const t2=teamScore(v,"t2");
  const isLayout2 = document.querySelector(".overlay").classList.contains("layout2");
  const bottom=$("bottom");
  const bottomText=$("bottomText");
  const powered=$("powered");

  if (isLayout2) {
    // Layout 2 always puts the current batting side on the left and bowling side on the right.
    const battingTeam = second ? t2 : t1;
    const bowlingTeam = second ? t1 : t2;

    $("name1").textContent = battingTeam.name;
    $("name2").textContent = bowlingTeam.name;
    showScore(1, battingTeam);
    $("score1").closest(".scorebox").style.display = "flex";
    $("score1").closest(".scorebox").style.visibility = "visible";
    $("score2").closest(".scorebox").style.display = "none";

    $("details1").innerHTML = showBatters(v);
    $("details2").innerHTML = showBowler(v, data.balls);

    // CricClubs' logo fields appear opposite to the visual team slots in the original overlay.
    logo("logo1", second ? v.firstLogo : v.secondLogo);
    logo("logo2", second ? v.secondLogo : v.firstLogo);

    if (completed(data,v)) {
      bottomText.textContent = get(v,"result",get(data,"result","Match completed"));
      bottom.classList.add("visible");
      if (powered) powered.style.display = "none";
      stopped = true;
      if (timer) clearTimeout(timer);
      return;
    }

    if (second) {
      const first = Number(get(v,"t1Total",""));
      const current = Number(t2.total);
      const needed = first + 1 - current;
      const limit = Number(get(v,"totalOvers",get(v,"oversLimit",get(v,"matchOvers",""))));
      const ballsBowled = overBalls(t2.overs);
      let message = get(v,"showMsgForScoreNeeded","");

      if (Number.isFinite(first) && Number.isFinite(current) && first >= 0) {
        if (needed <= 0) {
          message = "Target achieved";
        } else {
          message = `Need ${needed} runs to win`;
          if (Number.isFinite(limit) && limit > 0 && ballsBowled !== null) {
            const left = Math.max(0, limit * 6 - ballsBowled);
            if (left > 0) message += ` · ${left} balls left · RRR ${(needed * 6 / left).toFixed(2)}`;
          }
        }
      }
      bottomText.textContent = message;
      bottom.classList.add("visible");
    } else {
      // No chase bar during the first innings.
      bottom.classList.remove("visible");
      bottomText.textContent = "";
    }
    return;
  }

  // Layout 1: original design preserved.
  showScore(1,t1);
  showScore(2,t2);
  $("score1").closest(".scorebox").style.display = "";
  $("score2").closest(".scorebox").style.display = "";
  $("score1").closest(".scorebox").style.visibility = "visible";
  $("score2").closest(".scorebox").style.visibility = "visible";
  logo("logo1", v.secondLogo);
  logo("logo2", v.firstLogo);

  if(!second){
    $("details1").innerHTML=showBatters(v);
    $("details2").innerHTML=showBowler(v,data.balls);
  }else{
    $("details1").innerHTML=showBowler(v,data.balls);
    $("details2").innerHTML=showBatters(v);
  }

  if(completed(data,v)){
    bottomText.textContent=get(v,"result",get(data,"result","Match completed"));
    bottom.classList.add("visible");
    if(powered) powered.style.display="inline";
    stopped=true;
    if(timer)clearTimeout(timer);
    return;
  }

  if(second){
    const first=Number(get(v,"t1Total",""));
    const current=Number(t2.total);
    const needed=first+1-current;
    const limit=Number(get(v,"totalOvers",get(v,"oversLimit",get(v,"matchOvers",""))));
    const ballsBowled=overBalls(t2.overs);
    let message="";

    if(Number.isFinite(first)&&Number.isFinite(current)&&first>=0){
      if(needed<=0){
        message="Target achieved";
      }else{
        message=`Need ${needed} runs to win`;
        if(Number.isFinite(limit)&&limit>0&&ballsBowled!==null){
          const left=Math.max(0,limit*6-ballsBowled);
          if(left>0) message+=` · ${left} balls left · Required RR ${(needed*6/left).toFixed(2)}`;
        }
      }
    }else{
      message=get(v,"showMsgForScoreNeeded","");
    }
    bottomText.textContent=message;
    bottom.classList.add("visible");
    if(powered) powered.style.display="none";
  }else{
    bottom.classList.remove("visible");
  }
}
async function refresh(){
  if(stopped)return;
  try{
    const response=await fetch(API,{cache:"no-store"});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    render(await response.json());
    $("error").style.display="none";
  }catch(e){
    console.error(e);
    $("error").textContent="Live score temporarily unavailable. Retrying…";
    $("error").style.display="none";
  }
  if(!stopped)timer=setTimeout(refresh,REFRESH_MS);
}

refresh();
</script>
