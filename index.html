
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cricket Score Overlay</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:transparent;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}
html{height:100%}
body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
}

.top {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  min-width: 0;
}

.team {
  display: grid;
  min-width: 0;
  align-items: stretch;
  overflow: hidden;
}

.team.left {
  grid-template-columns:
    clamp(65px, 8vw, 112px)
    minmax(0, 1fr)
    clamp(90px, 11vw, 150px);
}

.team.right {
  grid-template-columns:
    clamp(90px, 11vw, 150px)
    minmax(0, 1fr)
    clamp(65px, 8vw, 112px);
}

.identity {
  min-width: 0;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 6px 5px;
  overflow: hidden;
}

.logo {
  display: block;
  width: min(58px, 100%);
  height: 48px;
  object-fit: contain;
  flex: 0 0 auto;
}

.team-name {
  width: 100%;
  min-width: 0;
  margin: 0;
  font-size: clamp(10px, 1.3vw, 20px);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .4px;
  line-height: 1.15;
  text-align: center;
  overflow-wrap: anywhere;
}
.scorebox {
  min-width: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 8px clamp(5px, 1vw, 10px);
  border-left: 1px solid #62758a;
  border-right: 1px solid #62758a;
}
.right .scorebox{grid-column:1;grid-row:1;border-left:0;border-right:1px solid #62758a}

.score {
  min-width: 0;
  font-size: clamp(20px, 3vw, 43px);
  line-height: 1.05;
  font-weight: 800;
  letter-spacing: -1px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.meta {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-top: 7px;
  font-size: clamp(9px, 1.1vw, 16px);
  line-height: 1.2;
  color: #d1dbe8;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.balls {
  display: flex;
  flex-direction: row;
  align-items: center;
  flex-wrap: nowrap;
  gap: 5px;
  min-width: 0;
  max-width: 100%;
  margin-top: 10px;
  overflow: hidden;
}

.ball-label {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  height: 26px;
  margin: 0 3px 0 0;
  font-size: 10px;
  line-height: 1;
  color: #9eb1c7;
  white-space: nowrap;
}

.ball {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 26px;
  min-width: 26px;
  padding: 0 5px;
  line-height: 1;
  border-radius: 5px;
  font-size: 11px;
}
.details {
  min-width: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 10px clamp(5px, 1vw, 12px);
}
.left .details{grid-column:2;grid-row:1}
.right .details{grid-column:2;grid-row:1}
.player {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 6px;
  min-width: 0;
  margin: 7px 0;
  font-size: clamp(9px, 1vw, 14px);
}

.player-name {
  display: block;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.player-stats {
  min-width: 0;
  white-space: nowrap;
  font-weight: 700;
}
.section-label{font-size:10px;color:#9eb1c7;letter-spacing:.7px;text-transform:uppercase;margin-bottom:5px}
.bowler-name,
.bowler-meta {
  min-width: 0;
  overflow-wrap: anywhere;
}


.ball.wicket{background:#c63c4b;color:#fff}
.ball.boundary{background:#e6bb5d;color:#17263a}
.right .identity{grid-column:3;grid-row:1}
.right .scorebox{grid-column:1;grid-row:1}
.right .details{grid-column:2;grid-row:1}
.bottom{display:none;min-height:53px;align-items:center;justify-content:center;text-align:center;padding:10px 12px;background:#0b1421;border-top:1px solid #33465c;color:#ffd16e;font-weight:800;font-size:20px}
.bottom.visible{display:flex}
.powered{font-size:9px;letter-spacing:1px;font-weight:500;color:#9aabbe;margin-left:14px;white-space:nowrap}
.error{display:none;padding:5px 10px;background:#672a36;font-size:11px}
@media(max-width:900px){
 .top{min-height:115px}
 .team.left{grid-template-columns:72px minmax(0,1fr) 105px}
 .team.right{grid-template-columns:105px minmax(0,1fr) 75px}
 .identity{padding:10px 3px 6px}
 .logo{width:43px;height:37px}
 .team-name{font-size:14px}
 .score{font-size:31px}
 .meta{font-size:12px;margin-top:5px}
 .details{padding:8px}
 .player{font-size:11px;margin:5px 0}
 .bowler-name{font-size:12px}
 .bowler-meta{font-size:11px;margin-top:5px}
 .balls{gap:4px;margin-top:8px}
 .ball{height:25px;min-width:25px;font-size:11px;padding:0 4px}
 .bottom{font-size:15px}
}

@media (max-width: 520px) {
  .meta {
    gap: 4px;
    font-size: 9px;
    margin-top: 5px;
  }

  .balls {
    flex-wrap: nowrap;
    gap: 3px;
    margin-top: 6px;
  }

  .ball-label {
    height: 19px;
    font-size: 8px;
    margin-right: 1px;
  }

  .ball {
    height: 19px;
    min-width: 17px;
    padding: 0 3px;
    font-size: 8px;
  }
}


/* Compact, translucent charcoal scoreboard */
.overlay {
  width:100%;
  margin-top:auto;
  background: rgba(24, 27, 31, var(--overlay-opacity, 0.70));
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 4px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
}

/* Reduce overall row height */
.top {
  min-height: 0;
}

.team.left,
.team.right {
  min-height: 0;
}

/* Smaller logos and tighter team identity */
.identity {
  gap: 2px;
  padding: 3px 5px;
}

.logo {
  width: 30px;
  height: 26px;
  object-fit: contain;
}

.team-name {
  color: #fff;
  font-size: 12px;
  line-height: 1.05;
}

/* Reduce space around player and bowler details */
.details {
  padding: 3px 6px;
}

.player {
  margin: 2px 0;
  line-height: 1.05;
}

.player-name,
.player-stats,
.bowler-name {
  color: #fff;
  line-height: 1.1;
}

.bowler-meta,
.meta {
  color: rgba(255, 255, 255, 0.78);
  margin-top: 2px;
  line-height: 1.05;
}

/* Smaller score panel */
.scorebox {
  padding: 3px 8px;
  background: rgba(255, 255, 255, 0.07);
  border-color: rgba(255, 255, 255, 0.15);
}

.score {
  color: #fff;
  font-size: clamp(20px, 2.3vw, 30px);
  line-height: 1;
}

.balls {
  margin-top: 4px;
  gap: 3px;
}

.ball,
.ball-label {
  height: 19px;
}

.ball {
  min-width: 19px;
  padding: 0 4px;
}

/* Compact bottom row for chase/result */
.bottom {
  min-height: 0;
  padding: 4px 8px;
  background: rgba(15, 17, 20, 0.78);
  border-top: 1px solid rgba(255, 255, 255, 0.15);
  color: #fff;
  font-size: 13px;
}

.powered {
  color: rgba(255, 255, 255, 0.65);
}

/* Smaller screens */
@media (max-width: 520px) {
  .identity {
    padding: 3px;
    gap: 1px;
  }

  .logo {
    width: 23px;
    height: 21px;
  }

  .team-name {
    font-size: 9px;
  }

  .details {
    padding: 3px;
  }

  .scorebox {
    padding: 3px 5px;
  }

  .score {
    font-size: 19px;
  }

  .player {
    margin: 1px 0;
  }

  .ball,
  .ball-label {
    height: 16px;
  }

  .ball {
    min-width: 16px;
    padding: 0 3px;
    font-size: 9px;
  }

  .bottom {
    padding: 3px 5px;
    font-size: 11px;
  }
}

/* Put Overs and Run Rate on separate lines */

.meta {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  line-height: 1.1;
  margin-top: 3px;
}

  width: 100%;
  margin-top: auto;
  overflow: hidden;
  border-radius: 9px;
  border: 1px solid rgba(255,255,255,.18);
  background: rgba(24,27,31,var(--overlay-opacity,.70));
  color: #fff;
}
.layout2 .top {
  display: grid;
  grid-template-columns: clamp(78px,8vw,120px) minmax(130px,1fr) clamp(150px,20vw,270px) minmax(130px,1fr) clamp(78px,8vw,120px);
  height: auto;
  min-height: 115px;
  align-items: stretch;
}
.layout2 .team { display: contents; }
.layout2 .team .identity,
.layout2 .team .details,
.layout2 .team .scorebox { min-width: 0; }

.layout2 .team.left .scorebox { grid-column: 3; grid-row: 1; z-index: 1; }

.layout2 .team.right .scorebox { display: none !important; }
.layout2 .team.left .scorebox {

}

    grid-template-columns: 48px minmax(80px,1fr) 100px minmax(80px,1fr) 48px;
    height: auto;
    min-height: 90px;
  }
  .layout2 .team.left .identity,
  .layout2 .team.right .identity { padding: 5px 2px; }
  .layout2 .logo { width: 27px; height: 25px; }
  .layout2 .team-name { font-size: 8px; }
  .layout2 #details1, .layout2 #details2 { padding: 5px 6px; }
  .layout2 .team.left .scorebox { width: calc(100% - 6px); height: 60px; padding: 4px; }

/* Match phases, compact secondary bar, and event animations */
.overlay .bottom {position:relative; gap:8px; padding-right:145px; min-height:27px;}
.overlay .bottom.visible {display:flex;}
.overlay .bottom .powered-credit {position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:10px;letter-spacing:.2px;font-weight:600;color:#c9d8ec;white-space:nowrap;}
.overlay .bottom .powered-credit a {color:inherit;text-decoration:none;}
.overlay .bottom #bottomText {min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.layout2 .top.pre-match .details {visibility:hidden;}
.layout2 .top.pre-match .scorebox {visibility:hidden!important;}
.layout2 .top.pre-match .identity {visibility:visible;}
.layout2 .top.pre-match {min-height:72px;}
.layout2 .top.pre-match .team.left .scorebox {display:flex!important;}
.event-animation {position:fixed;left:50%;top:65%;transform:translate(-50%,-50%) scale(.7);z-index:1000;pointer-events:none;opacity:0;display:flex;flex-direction:column;align-items:center;gap:5px;filter:drop-shadow(0 6px 20px rgba(0,0,0,.8));}
.event-animation.active {animation:score-event 2.4s ease-in-out both;}
.event-animation .event-emoji {font-size:clamp(45px,7vw,90px);}
.event-animation .event-text {font-size:clamp(32px,6vw,78px);font-weight:900;letter-spacing:2px;text-shadow:0 3px 0 #142640,0 6px 18px #000;}
.event-animation.wicket .event-text {color:#ff657b;}
.event-animation.four .event-text {color:#ffd36a;}
.event-animation.six .event-text {color:#71f6aa;}
@keyframes score-event {0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}15%,72%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.1)}}
@media(max-width:650px){.overlay .bottom{padding-right:112px;font-size:11px}.overlay .bottom .powered-credit{right:5px;font-size:8px;}}

.prematch-side{display:flex;align-items:center;justify-content:center;gap:15px;min-width:0;}

@media(max-width:650px){.prematch-side{gap:5px;flex-direction:column}.prematch-logo{width:40px;height:40px}}
/* Separate pre-match presentation; never use the five-column live scoreboard. */
.prematch-template[hidden]{display:none!important}
.prematch-template{display:grid;grid-template-columns:minmax(0,1fr) 78px minmax(0,1fr);align-items:center;min-height:92px;padding:12px 28px;background:linear-gradient(115deg,rgba(11,34,67,.96),rgba(30,74,119,.94),rgba(11,34,67,.96));text-align:center;gap:12px;}
.prematch-side{font-size:clamp(17px,2.4vw,32px);font-weight:900;letter-spacing:.4px;line-height:1.1;overflow-wrap:break-word;}

.overlay .bottom.projection #bottomText{position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 260px);text-align:center;font-weight:800;}
/* Celebrations: layered burst, confetti, motion and a distinctive theme for each event */
.event-animation{top:58%;width:min(640px,92vw);height:260px;justify-content:center;isolation:isolate;}
.event-animation .event-rays{position:absolute;width:210px;height:210px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.24) 0deg 8deg,transparent 8deg 24deg);opacity:0;z-index:-1;}
.event-animation .event-particles{position:absolute;inset:0;z-index:-1;}
.event-animation .particle{position:absolute;left:50%;top:48%;width:9px;height:15px;border-radius:2px;background:var(--particle,#ffd45b);opacity:0;}
.event-animation.active .particle{animation:particle-burst 1.4s cubic-bezier(.1,.6,.2,1) forwards;animation-delay:var(--delay);}
.event-animation.active .event-rays{animation:ray-burst 2s ease-out forwards;}
.event-animation .event-emoji{font-size:clamp(48px,7vw,85px);line-height:1;transform-origin:center;}
.event-animation .event-text{font-size:clamp(42px,7vw,88px);line-height:1;font-style:italic;letter-spacing:3px;-webkit-text-stroke:1px rgba(255,255,255,.45);}
.event-animation .event-subtitle{font-size:clamp(12px,1.7vw,19px);font-weight:900;letter-spacing:4px;text-shadow:0 3px 12px #000;}
.event-animation.wicket .event-text{color:#ff647e;text-shadow:0 0 22px #ff355b,0 4px 0 #74142d;}
.event-animation.four .event-text{color:#ffd456;text-shadow:0 0 25px #fba923,0 4px 0 #8e520a;}
.event-animation.six .event-text{color:#70f8c7;text-shadow:0 0 25px #00c9a5,0 4px 0 #09634e;}
.event-animation.wicket .event-emoji{animation:wicket-shake .7s ease-in-out 2;}
.event-animation.four .event-emoji{animation:four-slide 1.2s ease-out both;}
.event-animation.six .event-emoji{animation:six-launch 1.6s ease-out both;}
@keyframes particle-burst{0%{opacity:1;transform:translate(0,0) rotate(0)}70%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}
@keyframes ray-burst{0%{opacity:0;transform:scale(.2) rotate(0)}20%{opacity:1}100%{opacity:0;transform:scale(2) rotate(60deg)}}
@keyframes wicket-shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-18deg)}40%{transform:rotate(16deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(8deg)}}
@keyframes four-slide{0%{transform:translateX(-180px) rotate(-30deg);opacity:0}60%{transform:translateX(20px) rotate(10deg);opacity:1}100%{transform:translateX(0) rotate(0)}}
@keyframes six-launch{0%{transform:translateY(120px) scale(.4);opacity:0}55%{transform:translateY(-35px) scale(1.25);opacity:1}100%{transform:translateY(0) scale(1)}}
@media(max-width:650px){.prematch-template{grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);padding:12px 8px;gap:5px;min-height:70px}.prematch-side{font-size:14px}.overlay .bottom.projection #bottomText{max-width:calc(100% - 145px);font-size:10px;}}
/* Fallback team crests: initials appear if CricClubs has no logo or image fails. */
.prematch-emblem{position:relative;display:flex;align-items:center;justify-content:center;flex:0 0 auto;width:clamp(48px,6vw,84px);height:clamp(48px,6vw,84px);border-radius:50%;background:linear-gradient(145deg,#357da6,#153a66);border:2px solid rgba(208,233,255,.65);box-shadow:0 2px 12px rgba(0,0,0,.3);overflow:hidden}
.prematch-side:last-child .prematch-emblem{background:linear-gradient(145deg,#268c81,#14545e)}
.prematch-emblem .prematch-logo{width:100%;height:100%;object-fit:contain;position:relative;z-index:1}
.prematch-emblem .prematch-logo[hidden]{display:none}
.prematch-initials{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(17px,2.5vw,30px);font-weight:900;letter-spacing:-1px;color:white}
@media(max-width:650px){.prematch-emblem{width:40px;height:40px}.prematch-initials{font-size:15px}}

/* Uniform broadcast header: pre-game/toss and both innings share the same frame. */

 .layout2 .top,.layout2 .prematch-template{min-height:76px;}

 .layout2 .bottom.visible #bottomText{max-width:calc(100% - 135px);font-size:10px;}

<body>
<div class="overlay">
  <div class="prematch-template" id="prematchTemplate" hidden>
  <div class="prematch-side"><span class="prematch-emblem"><img class="prematch-logo" id="preLogo1" alt=""><span class="prematch-initials" id="preInitials1">TA</span></span><span id="preTeam1">TEAM A</span></div>
  <div class="prematch-versus">VS</div>
  <div class="prematch-side"><span class="prematch-emblem"><img class="prematch-logo" id="preLogo2" alt=""><span class="prematch-initials" id="preInitials2">TB</span></span><span id="preTeam2">TEAM B</span></div>
</div>
<div class="top">
    <section class="team left">
      <div class="identity">
        <img class="logo" id="logo1" alt="">
        <div class="team-name" id="name1">TEAM 1</div>
      </div>
      <div class="details" id="details1"></div>
      <div class="scorebox">
        <div class="score" id="score1">--/--</div>
        <div class="meta" id="meta1">
  <span id="overs1">Overs --</span>
  <span id="rr1">RR --</span>
</div>
      </div>
    </section>

    <section class="team right">
      <div class="scorebox">
        <div class="score" id="score2">--/--</div>
        <div class="meta" id="meta2">
  <span id="overs2">Overs --</span>
  <span id="rr2">RR --</span>
</div>
      </div>
      <div class="details" id="details2"></div>
      <div class="identity">
        <img class="logo" id="logo2" alt="">
        <div class="team-name" id="name2">TEAM 2</div>
      </div>
    </section>
  </div>

  <div class="bottom" id="bottom">
    <span id="bottomText"></span><span class="powered-credit">Powered by <a href="https://cricclubs.com" target="_blank" rel="noopener noreferrer">CricClubs</a></span>
  </div>
  <div class="error" id="error"></div>
  <div class="event-animation" id="scoreEvent" aria-live="polite">
    <div class="event-rays"></div><div class="event-particles"></div>
    <span class="event-emoji"></span><span class="event-text"></span><span class="event-subtitle"></span>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const clubId = params.get("clubId") || "22594";
const matchId = params.get("matchId") || "1374";

const requested = Number(params.get("refreshInterval") || params.get("refresh") || 5000);

const opacityValue = Number(params.get("opacity"));

const overlayOpacity = params.has("opacity") && Number.isFinite(opacityValue)
  ? Math.max(0.1, Math.min(1, opacityValue))
  : 0.70;

document.documentElement.style.setProperty(
  "--overlay-opacity",
  overlayOpacity
);

// Layout and theme are independent query parameters.
// layout=1 preserves the original design; layout=2 uses the reference broadcast layout.
const requestedLayout = (params.get("layout") || "2").trim().toLowerCase();
const overlayLayout = requestedLayout === "2" ? "2" : "1";
const requestedTheme = (params.get("theme") || "blue").trim().toLowerCase();
const overlayTheme = requestedTheme === "blue" ? "blue" : "graphite";
document.querySelector(".overlay").classList.toggle("layout2", overlayLayout === "2");
document.querySelector(".overlay").classList.toggle("theme-blue", overlayTheme === "blue");

const REFRESH_MS = Number.isFinite(requested)
  ? Math.max(1000, Math.min(requested, 60000))
  : 5000;

const API = `https://cricclubs.com/liveScoreOverlayData.do?clubId=${encodeURIComponent(clubId)}&matchId=${encodeURIComponent(matchId)}`;

let stopped = false;
let timer;

const $ = id => document.getElementById(id);
const get = (o,k,d="") => o?.[k] == null || o[k] === "" ? d : String(o[k]);
const truthy = x => ["true","1","yes"].includes(String(x).toLowerCase());

function logo(id,path){
  const img = $(id);
  if(!path){img.style.visibility="hidden";return;}
  img.style.visibility="visible";
  img.src = path.startsWith("http") ? path : new URL(path,"https://cricclubs.com").href;
  img.onerror = () => {img.style.visibility="hidden";};
}

function teamInitials(name){
  const words=String(name||'TEAM').trim().split(/\s+/).filter(Boolean);
  return (words.length>1 ? words.slice(0,2).map(w=>w[0]).join('') : (words[0]||'T').slice(0,2)).toUpperCase();
}
function prematchLogo(id, initialsId, name, path){
  const img=$(id);
  $(initialsId).textContent=teamInitials(name);
  img.onerror=()=>{img.hidden=true;img.removeAttribute('src');};
  if(!path){img.hidden=true;img.removeAttribute('src');return;}
  img.hidden=false;
  img.src=/^(https?:|data:|\/\/)/i.test(String(path)) ? path : new URL(path,'https://cricclubs.com').href;
}
function teamScore(v,p){
  return {
    name:get(v,p+"Name",p==="t1"?"Team A":"Team B"),
    total:get(v,p+"Total","0"),
    wickets:get(v,p+"Wickets","0"),
    overs:get(v,p+"Overs","0.0"),
    rr:get(v,p+"RR","--")
  };
}

function showScore(n, t) {
  $("name" + n).textContent = t.name;

  const isZeroZero =
    Number(t.total) === 0 && Number(t.wickets) === 0;

  $("score" + n).style.visibility =
    isZeroZero ? "hidden" : "visible";

  $("overs" + n).style.visibility =
    isZeroZero ? "hidden" : "visible";

  $("rr" + n).style.visibility =
    isZeroZero ? "hidden" : "visible";

  if (!isZeroZero) {
    $("score" + n).textContent = `${t.total}/${t.wickets}`;
    const shownOvers = document.querySelector(".overlay").classList.contains("layout2")
      ? formatOvers(t.overs)
      : t.overs;
    $("overs" + n).textContent = `Overs ${shownOvers}`;
    $("rr" + n).textContent = `RR ${t.rr}`;
  }
}
/*
function showScore(n,t){
  $("name"+n).textContent=t.name;
  $("score"+n).textContent=`${t.total}/${t.wickets}`;
  $("overs"+n).textContent=`Overs ${t.overs}`;
  $("rr"+n).textContent=`RR ${t.rr}`;
}
*/
function showBatters(v){
  return `
    <div class="player">
      <span class="player-name">${escapeHTML(get(v,"batsman1Name","Striker"))}</span>
      <span class="player-stats">${escapeHTML(get(v,"batsman1Runs","0"))} (${escapeHTML(get(v,"batsman1Balls","0"))})</span>
    </div>
    <div class="player">
      <span class="player-name">${escapeHTML(get(v,"batsman2Name","Non-striker"))}</span>
      <span class="player-stats">${escapeHTML(get(v,"batsman2Runs","0"))} (${escapeHTML(get(v,"batsman2Balls","0"))})</span>
    </div>`;
}

function showBowler(v,balls){
  const recent = Array.isArray(balls) ? balls.slice(-7) : [];
  const chips = recent.map(b=>{
    const x=String(b);
    let cls="ball";
    if(x.toUpperCase().includes("W")) cls+=" wicket";
    else if(x==="6") cls+=" boundary six";
    else if(x==="4") cls+=" boundary";
    return `<span class="${cls}">${escapeHTML(x)}</span>`;
  }).join("");

  return `
    <div class="bowler-row">
      <div class="bowler-name">${escapeHTML(get(v,"bowlerName","--"))}</div>
      <div class="bowler-meta">${escapeHTML(get(v,"bowlerWickets","0"))}/${escapeHTML(get(v,"bowlerRuns","0"))} (${escapeHTML(formatOvers(get(v,"bowlerOvers","0.0")))})</div>
    </div>
    <div class="balls"><span class="ball-label">THIS OVER</span>${chips}</div>`;
}

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function formatOvers(overs) {
  const value = String(overs ?? "").trim();
  if (!value) return "0.0";

  // CricClubs may return completed overs as "15", "15.", or "15.0".
  // Normalize all completed-over representations to include the .0 suffix.
  const completedOvers = value.match(/^(\\d+)\\.?$/);
  if (completedOvers) return `${completedOvers[1]}.0`;

  return value;
}

function overBalls(overs){
  const p=String(overs||"").split(".");
  const o=Number(p[0]), b=p.length>1?Number(p[1]):0;
  return Number.isFinite(o)&&Number.isFinite(b)?o*6+b:null;
}

function completed(data,v){
  return [
    data.isMatchEnded,data.matchEnded,data.isCompleted,
    v.isMatchEnded,v.matchEnded,v.isCompleted
  ].some(truthy);
}


const optional = (...xs) => xs.find(x => x !== undefined && x !== null && String(x).trim() !== "") ?? "";
const textField = (data,v,keys) => optional(...keys.map(k => v[k]),...keys.map(k => data[k]));
const urlParam = k => params.get(k) || "";
let lastEventSignature = null;
let eventReady = false;
let animationTimer;
function showEvent(kind) {
  const el=$("scoreEvent");
  const visual={wicket:["🏏","WICKET!"],four:["🏏","FOUR!"],six:["🚀","SIX!"]}[kind];
  if(!visual) return;
  clearTimeout(animationTimer);
  el.className="event-animation "+kind;
  const visuals={wicket:["💥","WICKET!",""],four:["🏏","FOUR!","RACING TO THE BOUNDARY"],six:["🚀","SIX!","OUT OF THE PARK"]};
  const v=visuals[kind];
  el.querySelector(".event-emoji").textContent=v[0];
  el.querySelector(".event-text").textContent=v[1];
  el.querySelector(".event-subtitle").textContent=v[2];
  const particles=el.querySelector(".event-particles");
  particles.replaceChildren();
  for(let i=0;i<26;i++){
    const part=document.createElement("span");
    part.className="particle";
    const angle=(i/26)*Math.PI*2;
    const radius=95+(i%5)*23;
    part.style.setProperty("--dx",Math.cos(angle)*radius+"px");
    part.style.setProperty("--dy",Math.sin(angle)*radius+"px");
    part.style.setProperty("--rot",(i*53)+"deg");
    part.style.setProperty("--delay",(i%5)*.035+"s");
    part.style.setProperty("--particle",kind==="wicket"?"#ff647e":kind==="six"?"#6df6c2":"#ffd456");
    particles.appendChild(part);
  }
  void el.offsetWidth;
  el.classList.add("active");
  animationTimer=setTimeout(()=>el.classList.remove("active"),2500);
}
function eventKind(x) {
  const b=String(x).trim().toUpperCase();
  if(/(^|[^A-Z])W($|[^A-Z])|WICKET|RUN\s*OUT|STUMPED/.test(b))return "wicket";
  if(/^4$|^4\b|FOUR/.test(b))return "four";
  if(/^6$|^6\b|SIX/.test(b))return "six";
  return "";
}
function watchLastBall(data,v,second) {
  const balls=Array.isArray(data.balls)?data.balls:[];
  const t=second?teamScore(v,"t2"):teamScore(v,"t1");
  const last=balls.length?String(balls[balls.length-1]):"";
  const signature=[second?"2":"1",t.total,t.wickets,t.overs,balls.length,last].join("|");
  if(eventReady && signature!==lastEventSignature && last) {
    const previous=lastEventSignature?.split("|");
    const changedScore=previous && (previous[1]!==t.total || previous[2]!==t.wickets || previous[3]!==t.overs);
    if(changedScore) showEvent(eventKind(last));
  }
  lastEventSignature=signature;
  eventReady=true;
}
function projectedScore(v,t) {
  const balls=overBalls(t.overs);
  const limit=Number(optional(v.totalOvers,v.oversLimit,v.matchOvers,urlParam("overs")));
  const runs=Number(t.total);
  if(!(balls>0 && limit>0 && Number.isFinite(runs)))return "";
  return `Projected ${Math.round(runs/balls*limit*6)} (${limit} overs)`;
}
function tossMessage(data,v) {
  const winner=textField(data,v,["tossWonBy","tossWinner","tossWonByTeam","tossWinnerName"]) || urlParam("tossWinner");
  const choice=textField(data,v,["tossDecision","electedTo","tossChoice","electedToDo"]) || urlParam("tossDecision");
  if(!winner)return "";
  return `${winner} won the toss${choice ? " and elected to "+choice : ""}`;
}
function postMatchMessage(data,v) {
  const result=textField(data,v,["result","matchResult"]) || "Match completed";
  const pom=textField(data,v,["playerOfMatch","playerOfTheMatch","pomName","manOfTheMatch"]) || urlParam("pom");
  return [result,pom?`POM: ${pom}`:""].filter(Boolean).join(" · ");
}
function showSecondary(message) {
  $("bottomText").textContent=message;
  $("bottom").classList.add("visible");
  $("bottom").classList.add("projection");
}
function matchNotStarted(data,v,t1,t2,second) {
  const status=textField(data,v,["matchStatus","status","statusText"]).toLowerCase();
  if(/live|in progress|innings break|completed|finished/.test(status))return false;
  if(/not started|upcoming|scheduled|toss/.test(status))return true;
  return !(Array.isArray(data.balls) && data.balls.length) && !second && Number(t1.total)===0 && Number(t2.total)===0 &&
    overBalls(t1.overs)===0 && overBalls(t2.overs)===0;
}

function render(data){
  const v=data.values||{};
  const second=truthy(data.isSecondInningsStarted)||truthy(v.isSecondInningsStarted);
  const t1=teamScore(v,"t1");
  const t2=teamScore(v,"t2");
  const isLayout2 = document.querySelector(".overlay").classList.contains("layout2");
  const bottom=$("bottom");
  const bottomText=$("bottomText");
  const powered=$("powered");
  const preMatch=!completed(data,v) && matchNotStarted(data,v,t1,t2,second);
  const overlayEl=document.querySelector(".overlay");
  overlayEl.classList.toggle("is-prematch",preMatch);
  $("prematchTemplate").hidden=!preMatch;
  $("bottom").classList.remove("projection");
  document.querySelector(".top").classList.toggle("pre-match",preMatch && isLayout2);
  if (!preMatch && !completed(data,v)) watchLastBall(data,v,second);
  if (preMatch) {
    $("name1").textContent=t1.name;
    $("name2").textContent=t2.name;
    $("preTeam1").textContent=t1.name;
    $("preTeam2").textContent=t2.name;
    prematchLogo("preLogo1","preInitials1",t1.name,v.secondLogo);
    prematchLogo("preLogo2","preInitials2",t2.name,v.firstLogo);
    logo("logo1",v.secondLogo);
    logo("logo2",v.firstLogo);
    $("details1").innerHTML=showBatters(v);
    $("details2").innerHTML=showBowler(v,data.balls);
    if (isLayout2) $("score1").closest(".scorebox").style.display="flex";
    showSecondary(tossMessage(data,v) || "Match yet to start");
    syncHeaderHeight();
    return;
  }


  if (isLayout2) {
    // Layout 2 always puts the current batting side on the left and bowling side on the right.
    const battingTeam = second ? t2 : t1;
    const bowlingTeam = second ? t1 : t2;

    $("name1").textContent = battingTeam.name;
    $("name2").textContent = bowlingTeam.name;
    showScore(1, battingTeam);
    $("score1").closest(".scorebox").style.display = "flex";
    $("score1").closest(".scorebox").style.visibility = "visible";
    $("score2").closest(".scorebox").style.display = "none";

    $("details1").innerHTML = showBatters(v);
    $("details2").innerHTML = showBowler(v, data.balls);

    // CricClubs' logo fields appear opposite to the visual team slots in the original overlay.
    logo("logo1", second ? v.firstLogo : v.secondLogo);
    logo("logo2", second ? v.secondLogo : v.firstLogo);

    if (completed(data,v)) {
      showSecondary(postMatchMessage(data,v));
      if (powered) powered.style.display = "none";
      stopped = true;
      if (timer) clearTimeout(timer);
      return;
    }

    if (second) {
      const first = Number(get(v,"t1Total",""));
      const current = Number(t2.total);
      const needed = first + 1 - current;
      const limit = Number(get(v,"totalOvers",get(v,"oversLimit",get(v,"matchOvers",""))));
      const ballsBowled = overBalls(t2.overs);
      let message = get(v,"showMsgForScoreNeeded","");

      if (Number.isFinite(first) && Number.isFinite(current) && first >= 0) {
        if (needed <= 0) {
          message = "Target achieved";
        } else {
          message = `Need ${needed} runs to win`;
          if (Number.isFinite(limit) && limit > 0 && ballsBowled !== null) {
            const left = Math.max(0, limit * 6 - ballsBowled);
            if (left > 0) message += ` · ${left} balls left · RRR ${(needed * 6 / left).toFixed(2)}`;
          }
        }
      }
      showSecondary(message);
    } else {
      // No chase bar during the first innings.
      showSecondary(projectedScore(v,t1) || "First innings");
    }
    return;
  }

  // Layout 1: original design preserved.
  showScore(1,t1);
  showScore(2,t2);
  $("score1").closest(".scorebox").style.display = "";
  $("score2").closest(".scorebox").style.display = "";
  $("score1").closest(".scorebox").style.visibility = "visible";
  $("score2").closest(".scorebox").style.visibility = "visible";
  logo("logo1", v.secondLogo);
  logo("logo2", v.firstLogo);

  if(!second){
    $("details1").innerHTML=showBatters(v);
    $("details2").innerHTML=showBowler(v,data.balls);
  }else{
    $("details1").innerHTML=showBowler(v,data.balls);
    $("details2").innerHTML=showBatters(v);
  }

  if(completed(data,v)){
    showSecondary(postMatchMessage(data,v));
    if(powered) powered.style.display="inline";
    stopped=true;
    if(timer)clearTimeout(timer);
    return;
  }

  if(second){
    const first=Number(get(v,"t1Total",""));
    const current=Number(t2.total);
    const needed=first+1-current;
    const limit=Number(get(v,"totalOvers",get(v,"oversLimit",get(v,"matchOvers",""))));
    const ballsBowled=overBalls(t2.overs);
    let message="";

    if(Number.isFinite(first)&&Number.isFinite(current)&&first>=0){
      if(needed<=0){
        message="Target achieved";
      }else{
        message=`Need ${needed} runs to win`;
        if(Number.isFinite(limit)&&limit>0&&ballsBowled!==null){
          const left=Math.max(0,limit*6-ballsBowled);
          if(left>0) message+=` · ${left} balls left · Required RR ${(needed*6/left).toFixed(2)}`;
        }
      }
    }else{
      message=get(v,"showMsgForScoreNeeded","");
    }
    showSecondary(message);
    if(powered) powered.style.display="none";
  }else{
    showSecondary(projectedScore(v,t1) || "First innings");
  }
}
async function refresh(){
  if(stopped)return;
  try{
    const response=await fetch(API,{cache:"no-store"});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    render(await response.json());
    $("error").style.display="none";
  }catch(e){
    console.error(e);
    $("error").textContent="Live score temporarily unavailable. Retrying…";
    $("error").style.display="block";
  }
  if(!stopped)timer=setTimeout(refresh,REFRESH_MS);
}

// Production: load CricClubs live data and refresh until the match is completed.
function syncHeaderHeight() {
  const overlay=document.querySelector('.overlay');
  const top=overlay.querySelector('.top');
  const pre=overlay.classList.contains('is-prematch');
  if(pre)overlay.classList.remove('is-prematch');
  const height=Math.ceil(top.getBoundingClientRect().height);
  if(pre)overlay.classList.add('is-prematch');
  if(height>0)overlay.style.setProperty('--live-header-height',height+'px');
}
window.addEventListener('resize',syncHeaderHeight);
refresh();
</script>
