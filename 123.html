
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>CricClubs iframe Test</title>
  <style>
    body {
      margin: 0;
      background: #171b24;
      color: white;
      font-family: Arial, sans-serif;
    }
    header { padding: 12px; }
    #status { color: #ffd166; margin-top: 8px; }
    iframe {
      width: 100%;
      height: 80vh;
      border: 1px solid #555;
      background: white;
    }
  </style>
</head>
<body>
  <header>
    <h3>CricClubs Scorecard Test — Match 4682</h3>
    <div id="status">Loading...</div>
  </header>

  <iframe
    id="scorecard"
    src="https://cricclubs.com/nacltennisballcricket/viewScorecard.do?matchId=4682&amp;clubId=27594">
  </iframe>

  <script>
    const frame = document.getElementById("scorecard");
    const status = document.getElementById("status");

    frame.onload = () => {
      status.textContent =
        "Iframe load event fired. Testing DOM access...";

      try {
        const html =
          frame.contentDocument.documentElement.outerHTML;

        status.textContent =
          "SUCCESS: HTML accessible (" +
          html.length + " characters)";
      } catch (error) {
        status.textContent =
          "Iframe loaded, but DOM access blocked: " +
          error.message;
      }
    };

    frame.onerror = () => {
      status.textContent =
        "Iframe load error (not always reliable).";
    };
  </script>
</body>
</html>
