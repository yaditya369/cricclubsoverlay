<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CricClubs Worker API Tester</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
    }

    h1 {
      margin-bottom: 8px;
      color: var(--accent);
    }

    p.subtitle {
      color: var(--text-muted);
      margin-top: 0;
      margin-bottom: 24px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .form-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

    label {
      display: flex;
      flex-direction: column;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    input {
      margin-top: 6px;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    button {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button.secondary {
      background-color: #334155;
      color: var(--text);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .status-tag {
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .status-tag.success { background: #059669; color: #fff; }
    .status-tag.error { background: #dc2626; color: #fff; }
    .status-tag.loading { background: #d97706; color: #fff; }

    #url-display {
      font-family: monospace;
      font-size: 0.85rem;
      word-break: break-all;
      background: #0f172a;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
      color: var(--accent);
    }

    iframe, textarea {
      width: 100%;
      height: 450px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-sizing: border-box;
    }

    textarea {
      background: #0f172a;
      color: #38bdf8;
      font-family: monospace;
      padding: 12px;
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>CricClubs Worker API Tester</h1>
  <p class="subtitle">Worker Endpoint: <code>https://cricclubs-api.y-aditya369.workers.dev</code></p>

  <div class="card">
    <div class="form-group">
      <label>Club ID
        <input type="text" id="clubId" value="27594">
      </label>
      <label>Match ID
        <input type="text" id="matchId" value="4635">
      </label>
      <label>Player ID
        <input type="text" id="playerId" value="2888744">
      </label>
      <label>League Subdomain
        <input type="text" id="league" value="cricclubs" placeholder="e.g. cricbay, nwcl">
      </label>
    </div>

    <div class="actions">
      <button onclick="testApi('scorecard')">Test Scorecard API</button>
      <button onclick="testApi('player')">Test Player Profile API</button>
      <button onclick="testApi('matches')">Test Matches List API</button>
      <button class="secondary" onclick="toggleViewMode()">Toggle Raw HTML / Preview</button>
    </div>
  </div>

  <div class="card">
    <div class="status-bar">
      <span>Request URL</span>
      <span id="status-badge" class="status-tag">Ready</span>
    </div>
    <div id="url-display">https://cricclubs-api.y-aditya369.workers.dev/?clubId=27594&matchId=4635</div>

    <iframe id="preview-frame" title="CricClubs API Output Preview"></iframe>
    <textarea id="raw-output" readonly placeholder="Raw HTML response will appear here..."></textarea>
  </div>
</div>

<script>
  const WORKER_BASE_URL = "https://cricclubs-api.y-aditya369.workers.dev";
  let showRaw = false;

  function toggleViewMode() {
    showRaw = !showRaw;
    const iframe = document.getElementById("preview-frame");
    const rawText = document.getElementById("raw-output");
    
    if (showRaw) {
      iframe.style.display = "none";
      rawText.style.display = "block";
    } else {
      iframe.style.display = "block";
      rawText.style.display = "none";
    }
  }

  async function testApi(type) {
    const clubId = document.getElementById("clubId").value.trim();
    const matchId = document.getElementById("matchId").value.trim();
    const playerId = document.getElementById("playerId").value.trim();
    const league = document.getElementById("league").value.trim() || "cricclubs";
    const statusBadge = document.getElementById("status-badge");
    const urlDisplay = document.getElementById("url-display");
    const iframe = document.getElementById("preview-frame");
    const rawText = document.getElementById("raw-output");

    let targetUrl = `${WORKER_BASE_URL}/?clubId=${clubId}&league=${league}`;

    if (type === "scorecard") {
      if (!matchId) return alert("Please enter a Match ID");
      targetUrl += `&matchId=${matchId}`;
    } else if (type === "player") {
      if (!playerId) return alert("Please enter a Player ID");
      targetUrl += `&playerId=${playerId}`;
    }

    urlDisplay.textContent = targetUrl;
    statusBadge.textContent = "Fetching...";
    statusBadge.className = "status-tag loading";

    try {
      const response = await fetch(targetUrl);
      const htmlText = await response.text();

      if (response.ok) {
        statusBadge.textContent = `HTTP ${response.status} OK`;
        statusBadge.className = "status-tag success";
      } else {
        statusBadge.textContent = `HTTP ${response.status} Error`;
        statusBadge.className = "status-tag error";
      }

      // Render response in iframe and raw textarea
      iframe.srcdoc = htmlText;
      rawText.value = htmlText;

    } catch (err) {
      statusBadge.textContent = "Fetch Failed (CORS/Network)";
      statusBadge.className = "status-tag error";
      rawText.value = `Error fetching data:\n${err.message}`;
    }
  }
</script>

</body>
</html>
