
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Cricket Overlay</title>

<style>
  
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: transparent;
  font-family: Arial, Helvetica, sans-serif;
  color: #fff;
}

body {
  padding: 0;
}

.scoreboard {
  width: 100%;
  max-width: 1100px;
  background: rgba(16, 24, 34, 0.96);
  border-radius: 3px;
  overflow: hidden;
  box-shadow: 0 2px 8px #0005;
}

.header {
  display: none;
}

.teams {
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 64px;
}

.team {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-rows: auto auto;
  align-content: center;
  column-gap: 10px;
  padding: 7px 12px;
  min-width: 0;
  background: #f4f5f6;
  color: #15202b;
}

.team + .team {
  border-left: 2px solid #25374b;
}

.team-name {
  grid-column: 1;
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin: 0;
}

.score {
  grid-column: 2;
  grid-row: 1 / 3;
  align-self: center;
  font-size: clamp(22px, 3vw, 34px);
  font-weight: 900;
  white-space: nowrap;
  letter-spacing: -1px;
}

.overs, .team .overs {
  grid-column: 1;
  font-size: 11px;
  color: #465467;
  margin-top: 3px;
  white-space: nowrap;
}

.details {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px 14px;
  padding: 6px 12px;
  background: #182330;
  font-size: 11px;
  line-height: 1.3;
}

#batters, #bowler, #result {
  min-width: 0;
  overflow-wrap: anywhere;
}

#recentBalls {
  display: flex;
  gap: 4px;
  margin: 0;
}

.ball {
  min-width: 20px;
  padding: 3px 5px;
  border-radius: 50%;
  background: #465467;
  text-align: center;
  font-size: 10px;
  font-weight: bold;
}

.ball.boundary { background: #198754; }
.ball.wicket { background: #d52b36; }
.ball.extra { background: #7953a9; }

.status {
  display: none;
}

@media (max-width: 500px) {
  .team {
    padding: 6px;
    column-gap: 5px;
  }

  .team-name { font-size: 10px; }
  .score { font-size: 21px; }
  .overs { font-size: 9px; }

  .details {
    padding: 5px 7px;
    gap: 5px 8px;
    font-size: 10px;
  }
}

</style>
</head>

<body>
<div class="scoreboard">
  <div class="header">
    <span id="matchTitle">LIVE CRICKET</span>
    <span class="live">LIVE</span>
  </div>

  <div class="teams">
    <div class="team">
      <div class="team-name" id="team1">Team 1</div>
      <div class="score" id="score1">--/--</div>
      <div class="overs" id="overs1">Overs: --</div>
      <div class="overs" id="rr1">RR: --</div>
    </div>

    <div class="team">
      <div class="team-name" id="team2">Team 2</div>
      <div class="score" id="score2">--/--</div>
      <div class="overs" id="overs2">Overs: --</div>
      <div class="overs" id="rr2">RR: --</div>
    </div>
  </div>

  <div class="details">
    <div id="batters">Batters: waiting for data...</div>
    <div id="bowler">Bowler: --</div>
    <div id="recentBalls" class="balls"></div>
    <div id="result"></div>
  </div>

  <div class="status" id="status">Connecting to CricClubs...</div>
</div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const clubId = params.get("clubId");
  const matchId = params.get("matchId");

  const $ = id => document.getElementById(id);

  // Require the match IDs in the URL.
  if (!clubId || !matchId) {
    $("status").textContent =
      "Add ?clubId=22594&matchId=1374 to the URL.";
    $("status").classList.add("error");
    return;
  }

  const api =
    "https://cricclubs.com/liveScoreOverlayData.do" +
    "?clubId=" + encodeURIComponent(clubId) +
    "&matchId=" + encodeURIComponent(matchId);

  const safe = value => String(value ?? "--")
    .replace(/[&<>"']/g, ch => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[ch]));

  const value = (values, key) => values[key] ?? "";

  function setText(id, text) {
    $(id).textContent = text;
  }

  function score(total, wickets) {
    return (total !== "" ? total : "--") + "/" +
           (wickets !== "" ? wickets : "--");
  }

  function renderBalls(balls) {
    const container = $("recentBalls");
    container.replaceChildren();

    if (!Array.isArray(balls)) return;

    balls.forEach(item => {
      const ball = String(item ?? "");
      const chip = document.createElement("span");
      chip.className = "ball";

      if (ball === "W") chip.classList.add("wicket");
      else if (ball === "4" || ball === "6")
        chip.classList.add("boundary");
      else if (/wd|nb|lb|b/i.test(ball))
        chip.classList.add("extra");

      chip.textContent = ball || "-";
      container.appendChild(chip);
    });
  }

  function render(data) {
    const v = data.values || {};

    setText("team1", value(v, "t1Name") || "Team 1");
    setText("team2", value(v, "t2Name") || "Team 2");

    setText("score1", score(v.t1Total, v.t1Wickets));
    setText("score2", score(v.t2Total, v.t2Wickets));

    setText("overs1", "Overs: " + (v.t1Overs || "--"));
    setText("overs2", "Overs: " + (v.t2Overs || "--"));

    setText("rr1", "RR: " + (v.t1RR || "--"));
    setText("rr2", "RR: " + (v.t2RR || "--"));

    const batter1 = v.batsman1Name
      ? `${v.batsman1Name} ${v.batsman1Runs || 0} (${v.batsman1Balls || 0})`
      : "";

    const batter2 = v.batsman2Name
      ? `${v.batsman2Name} ${v.batsman2Runs || 0} (${v.batsman2Balls || 0})`
      : "";

    const batterText = [batter1, batter2].filter(Boolean).join("  |  ");
    setText("batters", batterText ? "Batters: " + batterText : "Batters: --");

    const bowlerText = v.bowlerName
      ? `${v.bowlerName}  ${v.bowlerWickets || 0}-${v.bowlerRuns || 0}` +
        ` (${v.bowlerOvers || "0"})`
      : "--";

    setText("bowler", "Bowler: " + bowlerText);
    renderBalls(data.balls);

    setText("result", v.result || v.comments || "");

    const now = new Date().toLocaleTimeString();
    setText("status", "Auto-refresh: 5 seconds | Updated: " + now);
    $("status").classList.remove("error");
  }

  let busy = false;

  async function refresh() {
    if (busy) return;
    busy = true;

    try {
      const response = await fetch(api, { cache: "no-store" });

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const data = await response.json();

      if (!data.values) {
        throw new Error("Unexpected CricClubs response");
      }

      render(data);
    } catch (error) {
      console.error("Score refresh failed:", error);
      setText("status", "Unable to load score. Retrying in 5 seconds.");
      $("status").classList.add("error");
    } finally {
      busy = false;
    }
  }

  refresh();
  setInterval(refresh, 5000);
})();
</script>
</body>
</html>
