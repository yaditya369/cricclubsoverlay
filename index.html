
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Cricket Overlay</title>

<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
  }

  body { padding: 12px; }

  .scoreboard {
    width: min(100%, 1000px);
    background: rgba(10, 16, 28, 0.94);
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 18px rgba(0,0,0,.35);
  }

  .header {
    background: #087bce;
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    font-weight: bold;
  }

  .live {
    font-size: 12px;
    letter-spacing: 1px;
  }

  .live::before {
    content: "";
    display: inline-block;
    width: 8px;
    height: 8px;
    margin-right: 6px;
    border-radius: 50%;
    background: #57f28b;
  }

  .teams {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .team {
    padding: 16px;
    min-width: 0;
  }

  .team + .team {
    border-left: 1px solid rgba(255,255,255,.18);
  }

  .team-name {
    color: #c6d8ed;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 8px;
    overflow-wrap: anywhere;
  }

  .score {
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 800;
    letter-spacing: -1px;
  }

  .overs {
    color: #c4ceda;
    font-size: 14px;
    margin-top: 5px;
  }

  .details {
    padding: 10px 16px;
    border-top: 1px solid rgba(255,255,255,.15);
    font-size: 14px;
    line-height: 1.6;
    overflow-wrap: anywhere;
  }

  .balls {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  .ball {
    min-width: 27px;
    padding: 5px 7px;
    text-align: center;
    border-radius: 5px;
    background: #27364b;
    font-size: 12px;
    font-weight: bold;
  }

  .ball.boundary { background: #087bce; }
  .ball.wicket { background: #c62828; }
  .ball.extra { background: #7051a8; }

  .status {
    color: #b7c4d5;
    font-size: 11px;
    padding: 6px 16px;
    border-top: 1px solid rgba(255,255,255,.1);
  }

  .error { color: #ffb7b7; }

  @media (max-width: 420px) {
    .team { padding: 12px 9px; }
    .header, .details { padding-left: 10px; padding-right: 10px; }
  }
</style>
</head>

<body>
<div class="scoreboard">
  <div class="header">
    <span id="matchTitle">LIVE CRICKET</span>
    <span class="live">LIVE</span>
  </div>

  <div class="teams">
    <div class="team">
      <div class="team-name" id="team1">Team 1</div>
      <div class="score" id="score1">--/--</div>
      <div class="overs" id="overs1">Overs: --</div>
      <div class="overs" id="rr1">RR: --</div>
    </div>

    <div class="team">
      <div class="team-name" id="team2">Team 2</div>
      <div class="score" id="score2">--/--</div>
      <div class="overs" id="overs2">Overs: --</div>
      <div class="overs" id="rr2">RR: --</div>
    </div>
  </div>

  <div class="details">
    <div id="batters">Batters: waiting for data...</div>
    <div id="bowler">Bowler: --</div>
    <div id="recentBalls" class="balls"></div>
    <div id="result"></div>
  </div>

  <div class="status" id="status">Connecting to CricClubs...</div>
</div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const clubId = params.get("clubId");
  const matchId = params.get("matchId");

  const $ = id => document.getElementById(id);

  // Require the match IDs in the URL.
  if (!clubId || !matchId) {
    $("status").textContent =
      "Add ?clubId=22594&matchId=1374 to the URL.";
    $("status").classList.add("error");
    return;
  }

  const api =
    "https://cricclubs.com/liveScoreOverlayData.do" +
    "?clubId=" + encodeURIComponent(clubId) +
    "&matchId=" + encodeURIComponent(matchId);

  const safe = value => String(value ?? "--")
    .replace(/[&<>"']/g, ch => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[ch]));

  const value = (values, key) => values[key] ?? "";

  function setText(id, text) {
    $(id).textContent = text;
  }

  function score(total, wickets) {
    return (total !== "" ? total : "--") + "/" +
           (wickets !== "" ? wickets : "--");
  }

  function renderBalls(balls) {
    const container = $("recentBalls");
    container.replaceChildren();

    if (!Array.isArray(balls)) return;

    balls.forEach(item => {
      const ball = String(item ?? "");
      const chip = document.createElement("span");
      chip.className = "ball";

      if (ball === "W") chip.classList.add("wicket");
      else if (ball === "4" || ball === "6")
        chip.classList.add("boundary");
      else if (/wd|nb|lb|b/i.test(ball))
        chip.classList.add("extra");

      chip.textContent = ball || "-";
      container.appendChild(chip);
    });
  }

  function render(data) {
    const v = data.values || {};

    setText("team1", value(v, "t1Name") || "Team 1");
    setText("team2", value(v, "t2Name") || "Team 2");

    setText("score1", score(v.t1Total, v.t1Wickets));
    setText("score2", score(v.t2Total, v.t2Wickets));

    setText("overs1", "Overs: " + (v.t1Overs || "--"));
    setText("overs2", "Overs: " + (v.t2Overs || "--"));

    setText("rr1", "RR: " + (v.t1RR || "--"));
    setText("rr2", "RR: " + (v.t2RR || "--"));

    const batter1 = v.batsman1Name
      ? `${v.batsman1Name} ${v.batsman1Runs || 0} (${v.batsman1Balls || 0})`
      : "";

    const batter2 = v.batsman2Name
      ? `${v.batsman2Name} ${v.batsman2Runs || 0} (${v.batsman2Balls || 0})`
      : "";

    const batterText = [batter1, batter2].filter(Boolean).join("  |  ");
    setText("batters", batterText ? "Batters: " + batterText : "Batters: --");

    const bowlerText = v.bowlerName
      ? `${v.bowlerName}  ${v.bowlerWickets || 0}-${v.bowlerRuns || 0}` +
        ` (${v.bowlerOvers || "0"})`
      : "--";

    setText("bowler", "Bowler: " + bowlerText);
    renderBalls(data.balls);

    setText("result", v.result || v.comments || "");

    const now = new Date().toLocaleTimeString();
    setText("status", "Auto-refresh: 5 seconds | Updated: " + now);
    $("status").classList.remove("error");
  }

  let busy = false;

  async function refresh() {
    if (busy) return;
    busy = true;

    try {
      const response = await fetch(api, { cache: "no-store" });

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const data = await response.json();

      if (!data.values) {
        throw new Error("Unexpected CricClubs response");
      }

      render(data);
    } catch (error) {
      console.error("Score refresh failed:", error);
      setText("status", "Unable to load score. Retrying in 5 seconds.");
      $("status").classList.add("error");
    } finally {
      busy = false;
    }
  }

  refresh();
  setInterval(refresh, 5000);
})();
</script>
</body>
</html>
