
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cricket Score Overlay</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:transparent;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}
html{height:100%}
body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
}

.top {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  min-width: 0;
}

.team {
  display: grid;
  min-width: 0;
  align-items: stretch;
  overflow: hidden;
}

.team.left {
  grid-template-columns:
    clamp(65px, 8vw, 112px)
    minmax(0, 1fr)
    clamp(90px, 11vw, 150px);
}

.team.right {
  grid-template-columns:
    clamp(90px, 11vw, 150px)
    minmax(0, 1fr)
    clamp(65px, 8vw, 112px);
}

.identity {
  min-width: 0;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 6px 5px;
  overflow: hidden;
}

.logo {
  display: block;
  width: min(58px, 100%);
  height: 48px;
  object-fit: contain;
  flex: 0 0 auto;
}

.team-name {
  width: 100%;
  min-width: 0;
  margin: 0;
  font-size: clamp(10px, 1.3vw, 20px);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .4px;
  line-height: 1.15;
  text-align: center;
  overflow-wrap: anywhere;
}
.scorebox {
  min-width: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 8px clamp(5px, 1vw, 10px);
  border-left: 1px solid #62758a;
  border-right: 1px solid #62758a;
}
.right .scorebox{grid-column:1;grid-row:1;border-left:0;border-right:1px solid #62758a}

.score {
  min-width: 0;
  font-size: clamp(20px, 3vw, 43px);
  line-height: 1.05;
  font-weight: 800;
  letter-spacing: -1px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.meta {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-top: 7px;
  font-size: clamp(9px, 1.1vw, 16px);
  line-height: 1.2;
  color: #d1dbe8;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.balls {
  display: flex;
  flex-direction: row;
  align-items: center;
  flex-wrap: nowrap;
  gap: 5px;
  min-width: 0;
  max-width: 100%;
  margin-top: 10px;
  overflow: hidden;
}

.ball-label {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  height: 26px;
  margin: 0 3px 0 0;
  font-size: 10px;
  line-height: 1;
  color: #9eb1c7;
  white-space: nowrap;
}

.ball {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 26px;
  min-width: 26px;
  padding: 0 5px;
  line-height: 1;
  border-radius: 5px;
  font-size: 11px;
}
.details {
  min-width: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 10px clamp(5px, 1vw, 12px);
}
.left .details{grid-column:2;grid-row:1}
.right .details{grid-column:2;grid-row:1}
.player {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 6px;
  min-width: 0;
  margin: 7px 0;
  font-size: clamp(9px, 1vw, 14px);
}

.player-name {
  display: block;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.player-stats {
  min-width: 0;
  white-space: nowrap;
  font-weight: 700;
}
.section-label{font-size:10px;color:#9eb1c7;letter-spacing:.7px;text-transform:uppercase;margin-bottom:5px}
.bowler-name,
.bowler-meta {
  min-width: 0;
  overflow-wrap: anywhere;
}


.ball.wicket{background:#c63c4b;color:#fff}
.ball.boundary{background:#e6bb5d;color:#17263a}
.right .identity{grid-column:3;grid-row:1}
.right .scorebox{grid-column:1;grid-row:1}
.right .details{grid-column:2;grid-row:1}
.bottom{display:none;min-height:53px;align-items:center;justify-content:center;text-align:center;padding:10px 12px;background:#0b1421;border-top:1px solid #33465c;color:#ffd16e;font-weight:800;font-size:20px}
.bottom.visible{display:flex}
.powered{font-size:9px;letter-spacing:1px;font-weight:500;color:#9aabbe;margin-left:14px;white-space:nowrap}
.error{display:none;padding:5px 10px;background:#672a36;font-size:11px}
@media(max-width:900px){
 .top{min-height:115px}
 .team.left{grid-template-columns:72px minmax(0,1fr) 105px}
 .team.right{grid-template-columns:105px minmax(0,1fr) 75px}
 .identity{padding:10px 3px 6px}
 .logo{width:43px;height:37px}
 .team-name{font-size:14px}
 .score{font-size:31px}
 .meta{font-size:12px;margin-top:5px}
 .details{padding:8px}
 .player{font-size:11px;margin:5px 0}
 .bowler-name{font-size:12px}
 .bowler-meta{font-size:11px;margin-top:5px}
 .balls{gap:4px;margin-top:8px}
 .ball{height:25px;min-width:25px;font-size:11px;padding:0 4px}
 .bottom{font-size:15px}
}

@media (max-width: 520px) {
  .meta {
    gap: 4px;
    font-size: 9px;
    margin-top: 5px;
  }

  .balls {
    flex-wrap: nowrap;
    gap: 3px;
    margin-top: 6px;
  }

  .ball-label {
    height: 19px;
    font-size: 8px;
    margin-right: 1px;
  }

  .ball {
    height: 19px;
    min-width: 17px;
    padding: 0 3px;
    font-size: 8px;
  }
}


/* Compact, translucent charcoal scoreboard */
.overlay {
  width:100%;
  margin-top:auto;
  background: rgba(24, 27, 31, var(--overlay-opacity, 0.70));
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 4px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
}

/* Reduce overall row height */
.top {
  min-height: 0;
}

.team.left,
.team.right {
  min-height: 0;
}

/* Smaller logos and tighter team identity */
.identity {
  gap: 2px;
  padding: 3px 5px;
}

.logo {
  width: 30px;
  height: 26px;
  object-fit: contain;
}

.team-name {
  color: #fff;
  font-size: 12px;
  line-height: 1.05;
}

/* Reduce space around player and bowler details */
.details {
  padding: 3px 6px;
}

.player {
  margin: 2px 0;
  line-height: 1.05;
}

.player-name,
.player-stats,
.bowler-name {
  color: #fff;
  line-height: 1.1;
}

.bowler-meta,
.meta {
  color: rgba(255, 255, 255, 0.78);
  margin-top: 2px;
  line-height: 1.05;
}

/* Smaller score panel */
.scorebox {
  padding: 3px 8px;
  background: rgba(255, 255, 255, 0.07);
  border-color: rgba(255, 255, 255, 0.15);
}

.score {
  color: #fff;
  font-size: clamp(20px, 2.3vw, 30px);
  line-height: 1;
}

.balls {
  margin-top: 4px;
  gap: 3px;
}

.ball,
.ball-label {
  height: 19px;
}

.ball {
  min-width: 19px;
  padding: 0 4px;
}

/* Compact bottom row for chase/result */
.bottom {
  min-height: 0;
  padding: 4px 8px;
  background: rgba(15, 17, 20, 0.78);
  border-top: 1px solid rgba(255, 255, 255, 0.15);
  color: #fff;
  font-size: 13px;
}

.powered {
  color: rgba(255, 255, 255, 0.65);
}

/* Smaller screens */
@media (max-width: 520px) {
  .identity {
    padding: 3px;
    gap: 1px;
  }

  .logo {
    width: 23px;
    height: 21px;
  }

  .team-name {
    font-size: 9px;
  }

  .details {
    padding: 3px;
  }

  .scorebox {
    padding: 3px 5px;
  }

  .score {
    font-size: 19px;
  }

  .player {
    margin: 1px 0;
  }

  .ball,
  .ball-label {
    height: 16px;
  }

  .ball {
    min-width: 16px;
    padding: 0 3px;
    font-size: 9px;
  }

  .bottom {
    padding: 3px 5px;
    font-size: 11px;
  }
}

/* Put Overs and Run Rate on separate lines */

.meta {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  line-height: 1.1;
  margin-top: 3px;
}

  width: 100%;
  margin-top: auto;
  overflow: hidden;
  border-radius: 9px;
  border: 1px solid rgba(255,255,255,.18);
  background: rgba(24,27,31,var(--overlay-opacity,.70));
  color: #fff;
}
.layout2 .top {
  display: grid;
  grid-template-columns: clamp(78px,8vw,120px) minmax(130px,1fr) clamp(150px,20vw,270px) minmax(130px,1fr) clamp(78px,8vw,120px);
  height: auto;
  min-height: 115px;
  align-items: stretch;
}
.layout2 .team { display: contents; }
.layout2 .team .identity,
.layout2 .team .details,
.layout2 .team .scorebox { min-width: 0; }

.layout2 .team.left .scorebox { grid-column: 3; grid-row: 1; z-index: 1; }

.layout2 .team.right .scorebox { display: none !important; }
.layout2 .team.left .scorebox {

}

    grid-template-columns: 48px minmax(80px,1fr) 100px minmax(80px,1fr) 48px;
    height: auto;
    min-height: 90px;
  }
  .layout2 .team.left .identity,
  .layout2 .team.right .identity { padding: 5px 2px; }
  .layout2 .logo { width: 27px; height: 25px; }
  .layout2 .team-name { font-size: 8px; }
  .layout2 #details1, .layout2 #details2 { padding: 5px 6px; }
  .layout2 .team.left .scorebox { width: calc(100% - 6px); height: 60px; padding: 4px; }

/* Match phases, compact secondary bar, and event animations */
.overlay .bottom {position:relative; gap:8px; padding-right:145px; min-height:27px;}
.overlay .bottom.visible {display:flex;}
.overlay .bottom .powered-credit {position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:10px;letter-spacing:.2px;font-weight:600;color:#c9d8ec;white-space:nowrap;}
.overlay .bottom .powered-credit a {color:inherit;text-decoration:none;}
.overlay .bottom #bottomText {min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.layout2 .top.pre-match .details {visibility:hidden;}
.layout2 .top.pre-match .scorebox {visibility:hidden!important;}
.layout2 .top.pre-match .identity {visibility:visible;}
.layout2 .top.pre-match {min-height:72px;}
.layout2 .top.pre-match .team.left .scorebox {display:flex!important;}
.event-animation {position:fixed;left:50%;top:65%;transform:translate(-50%,-50%) scale(.7);z-index:1000;pointer-events:none;opacity:0;display:flex;flex-direction:column;align-items:center;gap:5px;filter:drop-shadow(0 6px 20px rgba(0,0,0,.8));}
.event-animation.active {animation:score-event 2.4s ease-in-out both;}
.event-animation .event-emoji {font-size:clamp(45px,7vw,90px);}
.event-animation .event-text {font-size:clamp(32px,6vw,78px);font-weight:900;letter-spacing:2px;text-shadow:0 3px 0 #142640,0 6px 18px #000;}
.event-animation.wicket .event-text {color:#ff657b;}
.event-animation.four .event-text {color:#ffd36a;}
.event-animation.six .event-text {color:#71f6aa;}
@keyframes score-event {0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}15%,72%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.1)}}
@media(max-width:650px){.overlay .bottom{padding-right:112px;font-size:11px}.overlay .bottom .powered-credit{right:5px;font-size:8px;}}

.prematch-side{display:flex;align-items:center;justify-content:center;gap:15px;min-width:0;}

<script>
const params = new URLSearchParams(location.search);
const clubId = params.get("clubId") || "22594";
const matchId = params.get("matchId") || "1374";

// refresh is expressed in seconds (e.g. refresh=5).
// Legacy refreshInterval remains supported in milliseconds for older links.
const refreshSeconds = Number(params.get("refresh") ?? "5");
const legacyRefreshMs = Number(params.get("refreshInterval") ?? "5000");

const opacityValue = Number(params.get("opacity"));

const overlayOpacity = params.has("opacity") && Number.isFinite(opacityValue)
  ? Math.max(0, Math.min(1, opacityValue))
  : 0.70;

document.documentElement.style.setProperty(
  "--overlay-opacity",
  overlayOpacity
);

// Layout and theme are independent query parameters.
// layout=1 preserves the original design; layout=2 uses the reference broadcast layout.
const requestedLayout = (params.get("layout") || "2").trim().toLowerCase();
const overlayLayout = ["2", "3", "4"].includes(requestedLayout) ? requestedLayout : "1";
const requestedTheme = (params.get("theme") || "mh").trim().toLowerCase();
const overlayTheme = ["blue", "graphite", "red", "mh"].includes(requestedTheme) ? requestedTheme : "mh";
document.querySelector(".overlay").classList.toggle("layout2", ["2", "3", "4"].includes(overlayLayout));
document.querySelector(".overlay").classList.toggle("layout3", overlayLayout === "3" || overlayLayout === "4");
document.querySelector(".overlay").classList.toggle("layout4", overlayLayout === "4");
document.querySelector(".overlay").classList.toggle("theme-blue", overlayTheme === "blue");
document.querySelector(".overlay").classList.toggle("theme-graphite", overlayTheme === "graphite");
document.querySelector(".overlay").classList.toggle("theme-red", overlayTheme === "red");
document.querySelector(".overlay").classList.toggle("theme-mh", overlayTheme === "mh");
document.body.classList.toggle("theme-red-active", overlayTheme === "red");
document.body.classList.toggle("theme-mh-active", overlayTheme === "mh");
document.body.classList.toggle("theme-blue-active", overlayTheme === "blue");
document.body.classList.toggle("theme-graphite-active", overlayTheme === "graphite");

const requestedRefreshMs = params.has("refresh") ? refreshSeconds * 1000 : legacyRefreshMs;
const REFRESH_MS = Number.isFinite(requestedRefreshMs) && requestedRefreshMs > 0
  ? Math.max(1000, Math.min(requestedRefreshMs, 60000))
  : 5000;

const API = `https://cricclubs.com/liveScoreOverlayData.do?clubId=${encodeURIComponent(clubId)}&matchId=${encodeURIComponent(matchId)}`;

let stopped = false;
let timer;

const $ = id => document.getElementById(id);
const get = (o,k,d="") => o?.[k] == null || o[k] === "" ? d : String(o[k]);
const truthy = x => ["true","1","yes"].includes(String(x).toLowerCase());

function logo(id,path){
  const img = $(id);
  if(!path){img.style.visibility="hidden";return;}
  img.style.visibility="visible";
  img.src = path.startsWith("http") ? path : new URL(path,"https://cricclubs.com").href;
  img.onerror = () => {img.style.visibility="hidden";};
}

function teamInitials(name){
  const clean=validDisplayName(name); if(!clean)return ''; const words=clean.split(/\s+/).filter(Boolean);
  return (words.length>1 ? words.slice(0,2).map(w=>w[0]).join('') : (words[0]||'T').slice(0,2)).toUpperCase();
}
function prematchLogo(id, initialsId, name, path){
  const img=$(id);
  $(initialsId).textContent=teamInitials(name);
  img.onerror=()=>{img.hidden=true;img.removeAttribute('src');};
  if(!path){img.hidden=true;img.removeAttribute('src');return;}
  img.hidden=false;
  img.src=/^(https?:|data:|\/\/)/i.test(String(path)) ? path : new URL(path,'https://cricclubs.com').href;
}
function validDisplayName(value) {
  const name=String(value??"").trim();
  if (!name || /^(?:team(?:\s*[ab12])?|batting team|bowling team|striker|non-striker|batsman|batter|bowler|unknown|tbd|n\/?a|--?|loading\.{0,3})$/i.test(name)) return "";
  return name;
}
function safeTeamLabel(value) { return validDisplayName(value); }
function teamScore(v,p){
  return {
    name:validDisplayName(get(v,p+"Name","")),
    total:get(v,p+"Total","0"),
    wickets:get(v,p+"Wickets","0"),
    overs:get(v,p+"Overs","0.0"),
    rr:get(v,p+"RR","--")
  };
}

function showScore(n, t) {
  $("name" + n).textContent = t.name;

  // Suppress the initial 0/0 only in Layout 1 before a ball has been bowled.
  // Layout 2 must always display the batting score, including 0/0.
  const isLayout2 = document.querySelector(".overlay").classList.contains("layout2");
  const isZeroZero = !isLayout2 &&
    Number(t.total) === 0 && Number(t.wickets) === 0 &&
    !(overBalls(t.overs) > 0);

  $("score" + n).style.visibility =
    isZeroZero ? "hidden" : "visible";

  $("overs" + n).style.visibility =
    isZeroZero ? "hidden" : "visible";

  $("rr" + n).style.visibility =
    isZeroZero ? "hidden" : "visible";

  if (!isZeroZero) {
    $("score" + n).textContent = `${t.total}/${t.wickets}`;
    const shownOvers = document.querySelector(".overlay").classList.contains("layout2")
      ? formatOvers(t.overs)
      : t.overs;
    $("overs" + n).textContent = `Overs ${shownOvers}`;
    $("rr" + n).textContent = `RR ${t.rr}`;
  }
}
/*
function showScore(n,t){
  $("name"+n).textContent=t.name;
  $("score"+n).textContent=`${t.total}/${t.wickets}`;
  $("overs"+n).textContent=`Overs ${t.overs}`;
  $("rr"+n).textContent=`RR ${t.rr}`;
}

function cricclubsProfileUrl(path) {
  const raw = String(path || "").trim();
  if (!raw) return "";
  try {
    const url = new URL(raw, "https://cricclubs.com/");
    return url.protocol === "https:" && url.hostname === "cricclubs.com" ? url.href : "";
  } catch (_) { return ""; }
}
// Layout 3 portrait cache: retain the actual loaded <img> nodes across score refreshes.
// A new player/profile URL creates a new image; unchanged URLs are never re-requested
// by our rendering logic. Browser/WebView HTTP caching handles future visits.
const layout3PortraitCache = new Map();
const LAYOUT3_PORTRAIT_LIMIT = 24;
function setPlayerDetails(el, html) {
  if (overlayLayout !== "3" && overlayLayout !== "4") { el.innerHTML = html; return; }
  // Save the live image nodes before replacing score/name text.
  for (const img of el.querySelectorAll('.l3-portrait img, .l3-bowler-portrait img')) {
    const key = img.dataset.portraitKey || img.getAttribute('src');
    if (key) {
      layout3PortraitCache.delete(key);
      layout3PortraitCache.set(key, img);
    }
  }
  el.innerHTML = html;
  for (const img of [...el.querySelectorAll('.l3-portrait img, .l3-bowler-portrait img')]) {
    const key = img.getAttribute('src');
    const cached = layout3PortraitCache.get(key);
    if (cached && cached !== img) {
      cached.dataset.portraitKey = key;
      // Keep failed-image fallback hidden instead of retrying every score tick.
      img.replaceWith(cached);
    } else if (key) {
      img.dataset.portraitKey = key;
      layout3PortraitCache.set(key, img);
    }
  }
  while (layout3PortraitCache.size > LAYOUT3_PORTRAIT_LIMIT) {
    layout3PortraitCache.delete(layout3PortraitCache.keys().next().value);
  }
}
// Track striker by feed order: batsman1 is the striker (existing gold-star convention).
// Do not replay the animation on routine 5-second score refreshes.
let l4LastStriker = "";
let l4LastBatters = "";
let l4StrikeChangedAt = 0;
function l4StrikeState(v) {
  if (overlayLayout !== "4") return {arrival:false,departure:false};
  const striker=validDisplayName(get(v,"batsman1Name",""));
  const other=validDisplayName(get(v,"batsman2Name",""));
  const pair=[striker,other].filter(Boolean).sort().join("|");
  if (!striker) {l4LastStriker="";l4LastBatters="";return {arrival:false,departure:false};}
  if (l4LastStriker && striker !== l4LastStriker) l4StrikeChangedAt=Date.now();
  l4LastStriker=striker;
  l4LastBatters=pair;
  const changing=Date.now()-l4StrikeChangedAt<500;
  return {arrival:changing,departure:changing};
}
function showBattersLayout3(v) {
  const strikeState = l4StrikeState(v);
  return [1,2].map(n => {
    const name = validDisplayName(get(v, "batsman"+n+"Name", ""));
    if (!name) return "";
    const image = cricclubsProfileUrl(get(v, "batsman"+n+"ProfileImange", ""));
    const runs = escapeHTML(get(v, "batsman"+n+"Runs", "0"));
    const balls = escapeHTML(get(v, "batsman"+n+"Balls", "0"));
    const fallback = escapeHTML(name.slice(0,1).toUpperCase());
    return `<div class="l3-batter${overlayLayout === "4" && n===1 ? " l4-on-strike" : ""}${overlayLayout === "4" && strikeState.arrival ? (n===1 ? " l4-strike-arrival" : " l4-strike-departure") : ""}">
      <div class="l3-portrait">${image ? `<img src="${escapeHTML(image)}" alt="" loading="eager" onerror="this.style.display='none'">` : ''}<span class="l3-initial">${fallback}</span></div>
      <div class="l3-batter-info"><span class="l3-batter-name" title="${escapeHTML(name)}">${escapeHTML(name)}${overlayLayout !== "4" && n===1 ? ' ★' : ''}</span><span class="l3-batter-score"><b>${runs}</b> <small>(${balls})</small>${overlayLayout === "4" && n===1 ? '<span class="l4-score-strike-star" title="On strike" aria-label="On strike">★</span>' : ''}</span></div>
    </div>`;
  }).join("");
}
function showBatters(v){
  if ((overlayLayout === "3" || overlayLayout === "4")) return showBattersLayout3(v);
  const first=validDisplayName(get(v,"batsman1Name",""));
  const second=validDisplayName(get(v,"batsman2Name",""));
  const row=(name,n,strike)=>name ? `<div class="player">
    <span class="player-name">${escapeHTML(name)}${strike?'<span class="strike-indicator" title="On strike" aria-label="On strike">★</span>':''}</span>
    <span class="player-stats">${escapeHTML(get(v,"batsman"+n+"Runs","0"))} (${escapeHTML(get(v,"batsman"+n+"Balls","0"))})</span>
  </div>` : "";
  return row(first,1,true)+row(second,2,false);
}

// Only report a total when the feed's deliveries can be assigned to this over.
function currentOverBalls(balls, overs) {
  if (!Array.isArray(balls)) return null;
  const m = String(overs ?? '').match(/^(\d+)\.(\d+)$/);
  if (!m) return null;
  const legalTarget = Number(m[2]);
  if (legalTarget < 1 || legalTarget > 5) return null;
  let legal = 0, start = balls.length;
  while (start > 0 && legal < legalTarget) {
    start--;
    if (!/(?:WD|WIDE|NB|NO.?BALL)/i.test(String(balls[start]))) legal++;
  }
  if (legal !== legalTarget) return null;
  // Extras before the first legal delivery cannot be assigned reliably from
  // a flat trailing-ball feed; avoid showing an inaccurate runs total.
  if (start > 0 && /(?:WD|WIDE|NB|NO.?BALL)/i.test(String(balls[start - 1]))) return null;
  return balls.slice(start);
}
// Preserve raw CricClubs tokens for calculations; abbreviate only their display.
function parseExtraBall(raw) {
  const x=String(raw).trim().toUpperCase().replace(/\s+/g,'');
  const wide=/(?:WD|WIDE)/.test(x);
  const noBall=/(?:NB|NOBALL|NO-BALL)/.test(x);
  const bye=/(?:LB|BYE|(?<!N)B(?!ALL))/.test(x) && !/^(?:NB|NOBALL)$/.test(x);
  const legBye=/(?:LB|LEGBYE)/.test(x);
  const isExtra=wide||noBall||bye;
  if(!isExtra) return null;
  // A token such as 1Wd denotes the one-run wide penalty, not a bye.
  // Additional byes must be explicitly identified by the source token.
  const label=(wide?'Y':noBall?'N':'')+(bye?((wide||noBall)?'+':'')+(legBye?'LB':'B'):'');
  return {label:label||'B',wide,noBall,bye};
}
function thisOverRuns(balls) {
  if (!balls || !balls.length) return null;
  let sum=0;
  for(const raw of balls){
    const x=String(raw).trim().toUpperCase().replace(/\s+/g,'');
    if(x==='.'||x==='0'||x==='W') continue;
    if(/^\d+$/.test(x)){sum+=Number(x);continue;}
    const extra=parseExtraBall(x);
    if(extra){
      const nums=[...x.matchAll(/\d+/g)].map(m=>Number(m[0]));
      // For CricClubs' '1Wd' and '1Nb', 1 is the full extra count.
      // If a compound token is ambiguous, avoid inventing runs.
      if(nums.length===1) sum+=nums[0];
      else if(nums.length===0) sum+=extra.wide||extra.noBall?1:0;
      else return null;
      continue;
    }
    const wicket=x.match(/^(\d+)W$/);
    if(wicket){sum+=Number(wicket[1]);continue;}
    return null;
  }
  return sum;
}
// Track bowler transitions at an over boundary. Keep the previous over visible
// at 3.0 until the next bowler is selected, then clear both chips and runs.
let previousOverBowler = null;
let previousOverInnings = null;
let previousOverNumber = null;
function bowlerPortraitInitials(name) {
  const words = String(name || "").trim().split(/\s+/).filter(Boolean);
  if (!words.length) return "?";
  return (words.length === 1 ? words[0].slice(0, 2) : words[0][0] + words[words.length - 1][0]).toUpperCase();
}
function showBowler(v,balls,inningsOvers){
  const oversText = String(inningsOvers ?? '0.0');
  const m = oversText.match(/^(\d+)\.(\d+)$/);
  const completedOvers = m ? Number(m[1]) : 0;

function observeCompletedOver(data,v,t1,t2,second,onBreak){
  if(!overSummaryEnabled)return;
  const t=second?t2:t1;
  const n=overBalls(t.overs);
  const key=(second?'2':'1')+':'+Math.floor((n||0)/6);
  const valid=n!==null&&n>0&&n%6===0;
  // Establish baseline on first load: don't replay a summary from hours ago.
  if(previousOverState===null){previousOverState={second,n};return;}
  const prev=previousOverState;

  // For nextBall mode, dismiss when the next over's first delivery has been recorded.
  // Any increase in delivered-ball count after the completed over qualifies.

  if(onBreak||completed(data,v)||!valid||prev.second!==second||prev.n===null||n<=prev.n||lastShownOverKey===key)return;

      if(second)renderBothTeamsSummary(loadedFullCard,t1,t2,Math.floor(n/6),data.balls);

const milestoneDefs = {

function milestoneRead(data,v,second,t1,t2){

  for(let n=1;n<=2;n++){
    const name=validDisplayName(get(v,'batsman'+n+'Name',''));
    const runs=milestoneNumeric(get(v,'batsman'+n+'Runs',''));

  }
  const bowler=validDisplayName(get(v,'bowlerName',''));

// Verified hat-trick tracking. Accepts structured delivery records supplied by the
// score API or by a separately configured feed, never un-attributed display tokens.
// Consecutive bowler deliveries include wides/no-balls (they break a hat-trick).
// Runs-outs, retired-outs, obstructing field and other non-bowler wickets do not count.
// Three consecutive wickets credited to one bowler can span overs.
const hatTrickStates = new Map();
const hatTrickProcessed = new Map();
let hatTrickFeed = null;
const hatTrickFeedUrl = params.get('hatTrickFeedUrl') || '';
const hatTrickMaxIds = 1000;
function hatValue(obj,...names){
  for(const n of names)if(obj?.[n]!==undefined && obj[n]!==null && obj[n]!=='')return obj[n];
  return null;
}
function hatTruthy(x){
  if(typeof x==='boolean')return x;
  if(typeof x==='number')return x!==0;
  return /^(1|true|yes|y)$/i.test(String(x??''));
}
function hatNormalize(record,inning){
  if(!record || typeof record!=='object' || Array.isArray(record))return null;
  const innings=Number(hatValue(record,'innings','inning','inningsNumber','inningNumber','inningsNo')??inning);
  if(innings!==inning)return null;
  const bowler=validDisplayName(hatValue(record,'bowlerName','bowler_name','bowler','bowlerFullName') ?? '');
  const bowlerId=hatValue(record,'bowlerId','bowler_id','bowlerPlayerId');
  const bowlerKey=bowlerId!=null?'id:'+String(bowlerId):bowler?'name:'+bowler.toLowerCase():'';
  if(!bowlerKey)return null;
  const over=hatValue(record,'overNumber','over','overNo','over_number');
  const ball=hatValue(record,'ballNumber','ball','ballNo','deliveryNumber','ball_number');
  const sequence=hatValue(record,'sequence','sequenceNumber','eventSequence','deliverySequence','index');
  const id=hatValue(record,'deliveryId','ballId','eventId','id');
  // A stable delivery ID or an explicit sequence is required for deduplication.
  const key=id!=null?'id:'+id:sequence!=null?'seq:'+sequence:
    over!=null&&ball!=null?'pos:'+over+'.'+ball:'';
  if(!key)return null;
  const out=hatValue(record,'dismissalType','wicketType','howOut','dismissal','outType');
  const outText=String(typeof out==='object'?hatValue(out,'type','name','kind')??'':out??'').trim().toLowerCase().replace(/[_-]/g,' ');
  const wicket=hatTruthy(hatValue(record,'isWicket','wicket','isOut','wicketFallen')) ||
    Boolean(outText && outText!=='not out');
  const nonBowler=/(run\s*out|retired|obstruct|timed\s*out)/i.test(outText);
  const credited=hatValue(record,'creditedToBowler','bowlerCredited','isBowlerWicket','countsForBowler');
  // Never infer a credited wicket from a bare "W" marker.
  const bowlerWicket=wicket && (credited!=null ? hatTruthy(credited) :
    Boolean(outText && !nonBowler && /^(bowled|caught|caught and bowled|lbw|l b w|stumped|hit wicket)$/.test(outText)));
  return {innings,bowler,bowlerKey,key,bowlerWicket,sequence:sequence==null?null:Number(sequence),
    over:over==null?null:Number(over),ball:ball==null?null:Number(ball)};
}
function hatDeliveryList(payload,inning){
  if(Array.isArray(payload))return payload;
  if(!payload || typeof payload!=='object')return [];
  const nested=payload.innings?.[inning-1];
  for(const value of [payload.deliveries,payload.ballByBall,payload.ballbyball,
    payload.deliveryEvents,payload.ballsDetailed,payload.events,
    nested?.deliveries,nested?.ballByBall,nested?.balls]){
    if(Array.isArray(value)&&value.some(x=>x&&typeof x==='object'&&!Array.isArray(x)))return value;
  }
  return [];
}
function hatSort(a,b){
  if(a.sequence!=null&&b.sequence!=null)return a.sequence-b.sequence;
  if(a.over!=null&&b.over!=null && a.ball!=null&&b.ball!=null)
    return a.over-b.over||a.ball-b.ball;
  return 0;
}
function hatProcess(payload,inning,allowCelebration=true){
  const normalized=hatDeliveryList(payload,inning).map(x=>hatNormalize(x,inning)).filter(Boolean);
  if(!normalized.length)return 0;
  normalized.sort(hatSort);
  const known=hatTrickProcessed.get(inning)||new Set();
  const state=hatTrickStates.get(inning)||{bowlerKey:'',count:0,primed:false};
  // On the first complete snapshot, establish a baseline without celebrating
  // historic hat-tricks; process future newly received deliveries normally.
  const initial=!state.primed;
  let detected=0;
  for(const delivery of normalized){
    if(known.has(delivery.key))continue;
    known.add(delivery.key);
    if(known.size>hatTrickMaxIds){const first=known.values().next().value;known.delete(first);}
    // Only consecutive deliveries BY THIS BOWLER count. An intervening
    // delivery by a different bowler does not reset the previous bowler's
    // streak, allowing a hat-trick across overs.
    const bowlerState=state[delivery.bowlerKey]||{count:0};
    bowlerState.count=delivery.bowlerWicket?bowlerState.count+1:0;
    state[delivery.bowlerKey]=bowlerState;
    if(bowlerState.count===3){
      detected++;
      if(!initial&&allowCelebration)
        milestoneAdd('hat',String(inning)+'|hat|'+delivery.bowlerKey+'|'+delivery.key,delivery.bowler);
    }

function observeHatTrick(data,inning,preMatch,onBreak,isFinished){
  if(!milestoneEnabled||overlayLayout!=='4'||preMatch)return;
  const payload=hatTrickFeed||data;
  hatProcess(payload,inning,!onBreak&&!isFinished);
}
async function fetchHatTrickFeed(){
  if(!hatTrickFeedUrl || !milestoneEnabled || overlayLayout!=='4')return;
  try{
    const response=await fetch(hatTrickFeedUrl,{cache:'no-store'});
    if(!response.ok)throw Error('Hat-trick feed HTTP '+response.status);
    hatTrickFeed=await response.json();
  }catch(err){console.warn('Hat-trick delivery feed unavailable:',err);}
}

function observeMilestones(data,v,second,t1,t2,preMatch,onBreak,isFinished){
  if(!milestoneEnabled||overlayLayout!=='4'||preMatch)return;
  const now=milestoneRead(data,v,second,t1,t2);
  const prev=milestoneBaseline;milestoneBaseline=now;
  if(!prev||prev.inning!==now.inning||onBreak||isFinished)return;
  const prefix=String(now.inning)+'|';
  for(const n of [50,100,150,200,250]){
    if(prev.total!==null&&now.total!==null&&prev.total<n&&now.total>=n)
      milestoneAdd('team'+n,prefix+'team'+n);
  }
  for(const [name,bat] of Object.entries(now.bat)){
    const old=prev.bat[name];
    if(!old)continue;
    for(const n of [50,100]){
      if(old.runs<n&&bat.runs>=n)
        milestoneAdd('bat'+n,prefix+'bat'+n+'|'+name,name,bat.runs+' RUNS'+(bat.balls?' · '+bat.balls+' BALLS':''));
    }
  }
  for(const [name,bowl] of Object.entries(now.bowl)){
    const old=prev.bowl[name];
    if(!old)continue;
    if(old.wickets!==null&&bowl.wickets!==null&&old.wickets<5&&bowl.wickets>=5)
      milestoneAdd('five',prefix+'five|'+name,name,bowl.wickets+' WICKETS');
    if(old.maidens!==null&&bowl.maidens!==null&&bowl.maidens>old.maidens)
      milestoneAdd('maiden',prefix+'maiden|'+name+'|'+bowl.maidens,name);
  }
  if(now.part&&prev.part&&now.part.key===prev.part.key){
    for(const n of [50,100]){
      if(prev.part.runs<n&&now.part.runs>=n)
        milestoneAdd('part'+n,prefix+'part'+n+'|'+now.part.key,now.part.name);
    }
  }
  // A hat-trick is evaluated separately from verified, delivery-level events.
  // Do not infer the bowler from a flat THIS OVER display token.
  try { observeHatTrick(data,now.inning,preMatch,onBreak,isFinished); }
  catch(err){ console.warn('Hat-trick tracking skipped:',err); }

}

    logo("logo2",v.secondLogo);
    $("details1").innerHTML=showBatters(v);
    $("details2").innerHTML=showBowler(v,data.balls,second?t2.overs:t1.overs);
    if (isLayout2) $("score1").closest(".scorebox").style.display="flex";
    showSecondary(tossMessage(data,v) || "Match yet to start");
    syncHeaderHeight();
    return;
  }


  if (isLayout2) {
    // Layout 2 always puts the current batting side on the left and bowling side on the right.
    const battingTeam = second ? t2 : t1;
    const bowlingTeam = second ? t1 : t2;

    $("name1").textContent = battingTeam.name;
    $("name2").textContent = bowlingTeam.name;
    showScore(1, battingTeam);
    $("score1").closest(".scorebox").style.display = "flex";
    $("score1").closest(".scorebox").style.visibility = "visible";
    $("score2").closest(".scorebox").style.display = "none";

    setPlayerDetails($("details1"), showBatters(v));
    setPlayerDetails($("details2"), showBowler(v, data.balls, second?t2.overs:t1.overs));

    // Layout 2: first-innings logos corrected; preserve the working second-innings mapping.
    logo("logo1", v.firstLogo);
    logo("logo2", v.secondLogo);

    if (isFinished) {
      showSecondary(postMatchMessage(data,v));
      // Preserve the bottom result/footer while showing the centered result.
      stopped = true;
      if (timer) clearTimeout(timer);
      return;
    }

    if (onBreak) {
      $("details1").innerHTML = '<div class="innings-break-detail">FIRST INNINGS COMPLETE</div>';
      $("details2").innerHTML = '<div class="innings-break-detail">SECOND INNINGS TO FOLLOW</div>';
      showSecondary(breakMessage(t1));
      return;
    }

    if (second) {
      const first = Number(get(v,"t1Total",""));
      const current = Number(t2.total);
      const needed = first + 1 - current;
      const limit = Number(get(v,"totalOvers",get(v,"oversLimit",get(v,"matchOvers",""))));
      const ballsBowled = overBalls(t2.overs);
      let message = get(v,"showMsgForScoreNeeded","");

      if (Number.isFinite(first) && Number.isFinite(current) && first >= 0) {
        if (needed <= 0) {
          message = "Target achieved";
        } else {
          message = `Need ${needed} runs to win`;
          if (Number.isFinite(limit) && limit > 0 && ballsBowled !== null) {
            const left = Math.max(0, limit * 6 - ballsBowled);
            if (left > 0) message += ` · ${left} balls left · RRR ${(needed * 6 / left).toFixed(2)}`;
          }
        }
      }
      showSecondary(message);
    } else {
      // No chase bar during the first innings.
      showSecondary(projectedScore(v,t1) || "First innings");
    }
    return;
  }

  // Layout 1: original design preserved.
  showScore(1,t1);
  showScore(2,t2);
  $("score1").closest(".scorebox").style.display = "";
  $("score2").closest(".scorebox").style.display = "";
  $("score1").closest(".scorebox").style.visibility = "visible";
  $("score2").closest(".scorebox").style.visibility = "visible";
  logo("logo1", v.secondLogo);
  logo("logo2", v.firstLogo);

  if(!second){
    $("details1").innerHTML=showBatters(v);
    $("details2").innerHTML=showBowler(v,data.balls,second?t2.overs:t1.overs);
  }else{
    $("details1").innerHTML=showBowler(v,data.balls,second?t2.overs:t1.overs);
    $("details2").innerHTML=showBatters(v);
  }

  if(isFinished){
    showSecondary(postMatchMessage(data,v));
    if(powered) powered.style.display="inline";
    stopped=true;
    if(timer)clearTimeout(timer);
    return;
  }

  if(onBreak){
    $("details1").innerHTML='<div class="innings-break-detail">FIRST INNINGS COMPLETE</div>';
    $("details2").innerHTML='<div class="innings-break-detail">SECOND INNINGS TO FOLLOW</div>';
    showSecondary(breakMessage(t1));
    if(powered)powered.style.display="inline";
    return;
  }

  if(second){
    const first=Number(get(v,"t1Total",""));
    const current=Number(t2.total);
    const needed=first+1-current;
    const limit=Number(get(v,"totalOvers",get(v,"oversLimit",get(v,"matchOvers",""))));
    const ballsBowled=overBalls(t2.overs);
    let message="";

    if(Number.isFinite(first)&&Number.isFinite(current)&&first>=0){
      if(needed<=0){
        message="Target achieved";
      }else{
        message=`Need ${needed} runs to win`;
        if(Number.isFinite(limit)&&limit>0&&ballsBowled!==null){
          const left=Math.max(0,limit*6-ballsBowled);
          if(left>0) message+=` · ${left} balls left · Required RR ${(needed*6/left).toFixed(2)}`;
        }
      }
    }else{
      message=get(v,"showMsgForScoreNeeded","");
    }
    showSecondary(message);
    if(powered) powered.style.display="none";
  }else{
    showSecondary(projectedScore(v,t1) || "First innings");
  }
}
async function refresh(){
  if(stopped)return;
  try{
    const response=await fetch(API,{cache:"no-store"});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    const liveData=await response.json();
    await fetchHatTrickFeed();
    render(liveData);
    $("error").style.display="none";
  }catch(e){
    console.error("CricClubs refresh/render failed:", e);
    $("error").textContent="Live score temporarily unavailable. Retrying…";
    $("error").style.display="block";
  }
  if(!stopped)timer=setTimeout(refresh,REFRESH_MS);
}

// Optional browser-only vertical adjustment. Default is 0px for Android WebView.
// Example: &bottomOffset=24 moves the scoreboard 24 CSS pixels upward.
(function applyBottomOffset() {
  const raw = new URLSearchParams(window.location.search).get('bottomOffset');
  const parsed = raw === null || raw.trim() === '' ? 0 : Number(raw);
  const offset = Number.isFinite(parsed) ? Math.min(250, Math.max(0, parsed)) : 0;
  document.documentElement.style.setProperty('--scoreboard-bottom-offset', offset + 'px');
})();

// Optional animation preview. Does not change match data or scoring.
// highlight=four|six|wicket&highlightCount=3
(function previewHighlightFromQuery() {
  const raw = (params.get('highlight') || '').trim().toLowerCase();
  const kinds = {four:'four', '4':'four', six:'six', '6':'six', wicket:'wicket', w:'wicket'};
  const kind = kinds[raw];
  if (!kind) return;
  const requested = Number(params.get('highlightCount') ?? '1');
  const count = Number.isFinite(requested) ? Math.max(1, Math.min(20, Math.floor(requested))) : 1;
  // Each celebration lasts 2.5 seconds; wait until it has finished before replaying.
  for (let i = 0; i < count; i++) {
    setTimeout(() => { const eventLayer=document.getElementById("scoreEvent"); if(eventLayer) eventLayer.style.removeProperty("display"); showEvent(kind); }, 600 + i * 2900);
  }
})();

// Standalone preview of the final result layout, without live match data.
if(params.get("demo")==="matchResult"){
  render({matchStatus:"Completed",isMatchEnded:true,isSecondInningsStarted:true,
    result:"Vikings won by 6 Wickets",playerOfMatch:"KRISHNA TEJA REDDY VAVVETI",
    values:{t1Name:"Lords",t1Total:"111",t1Wickets:"10",t1Overs:"19.1",t1RR:"5.79",
      t2Name:"Vikings",t2Total:"112",t2Wickets:"4",t2Overs:"15.2",t2RR:"7.30"},balls:[]});
}
// Production: load CricClubs live data and refresh until the match is completed.
function syncHeaderHeight() {
  const overlay=document.querySelector('.overlay');
  const top=overlay.querySelector('.top');
  const pre=overlay.classList.contains('is-prematch');
  if(pre)overlay.classList.remove('is-prematch');
  const height=Math.ceil(top.getBoundingClientRect().height);
  if(pre)overlay.classList.add('is-prematch');
  if(height>0)overlay.style.setProperty('--live-header-height',height+'px');
}
window.addEventListener('resize',syncHeaderHeight);
if (urlParam("demo") === "matchResult") {
  // Preview card is already rendered above; do not fetch or overwrite it.
} else if (overSummaryEnabled && urlParam("demo") === "secondInningsSummary") {
  const a={name:'DEMO XI',total:156,wickets:8,overs:'20.0',rr:'7.80'};
  const b={name:'PRACTICE XI',total:74,wickets:2,overs:'10.0',rr:'7.40'};
  renderBothTeamsSummary(demoFullCard,a,b,10,['1','4','0','2','1','0']);
  document.body.classList.add('show-over-summary');
} else if (overSummaryEnabled && urlParam("demo") === "overSummary") {
  const t={name:'RAGING BULLS',total:63,wickets:2,overs:'8.0',rr:'7.88'};
  renderCompactSummary(demoFullCard,t,false,8,false,['1','4','0','2','1','0']);
  document.body.classList.add('show-over-summary');
} else if (inningsBreakSummaryEnabled && urlParam("demo") === "inningsBreak") {
  render({
    matchStatus: "Innings Break",
    isSecondInningsStarted: false,
    values: {
      t1Name: "DEMO XI", t1Total: "156", t1Wickets: "8", t1Overs: "20.0", t1RR: "7.80",
      t2Name: "PRACTICE XI", t2Total: "0", t2Wickets: "0", t2Overs: "0.0",
      totalOvers: "20"
    }, balls: []
  });
} else {
  refresh();
}
